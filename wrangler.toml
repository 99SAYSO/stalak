# Cloudflare Pages configuration for Stalak (project "stalak-site").
# When this file is in the repo, Cloudflare uses it as the source of truth for the
# bindings and variables below: they can no longer be edited in the dashboard.
# Secrets (PADDLE_API_KEY, PADDLE_WEBHOOK_SECRET, RESEND_API_KEY, AUTH_SECRET) are NOT here:
# set them in the dashboard (Settings > Variables and Secrets, type "Secret"). See BACKEND.md.

name = "stalak-site"
pages_build_output_dir = "public"
compatibility_date = "2026-06-01"

# Public, non-secret settings (production).
[vars]
APP_ORIGIN = "https://stalak.app"
PADDLE_ENV = "sandbox"             # switch to "production" once Paddle has approved the account
PADDLE_CLIENT_TOKEN = "test_6ba61e76a40fdce6b9d25c3eb9a"           # client-side token: test_... (sandbox) or live_... (production)
PADDLE_PRICE_MONTH = "pri_01m5ygermd2pjw66mgdsh4f4rw"            # pri_... for 9.99 EUR / month
PADDLE_PRICE_YEAR = "pri_01m5ygfwqdq8h2ax297c6qagjs"             # pri_... for 79 EUR / year
SOCIAL_CONNECT_ENABLED = "0"
GOOGLE_CLIENT_ID = "912353079416-aq4ljmd2n7ijcfl92025egde3r5nhnc9.apps.googleusercontent.com"   # public; the secret GOOGLE_CLIENT_SECRET is set in Cloudflare       # TikTok / Instagram posting: not implemented, keep "0"

# D1 database. Create it first (BACKEND.md, step 2) and paste its id below:
# a wrong id makes the Pages deployment fail.
[[d1_databases]]
binding = "DB"
database_name = "stalak"
database_id = "fc4c8647-2357-4f7e-821c-e360c861a712"
migrations_dir = "migrations"

# R2 bucket for the media of projects saved online (Stalak Pro): the song and the takes, keys u/<userId>/p/<projectId>/<fileId>.
# The bucket "stalak-media" must exist (private, no public access): a binding to a missing bucket makes the deployment fail.
# To turn online saving off, comment these 3 lines: the code then answers "cloud_unavailable" and the app shows « bientôt ».
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "stalak-media"
# Optional: CLOUD_QUOTA_BYTES (default 21474836480 = 20 GB per user) and the secret CRON_SECRET (see BACKEND.md, step 10).

# Preview deployments (branches other than main) use the same values and the same database.
# To isolate them later, add [env.preview.vars] and [[env.preview.d1_databases]] sections.
