# Cloudflare Pages configuration for Stalak (project "stalak-site").
# When this file is in the repo, Cloudflare uses it as the source of truth for the
# bindings and variables below: they can no longer be edited in the dashboard.
# Secrets (PADDLE_API_KEY, PADDLE_WEBHOOK_SECRET, RESEND_API_KEY, AUTH_SECRET) are NOT here:
# set them in the dashboard (Settings > Variables and Secrets, type "Secret"). See BACKEND.md.

name = "stalak-site"
pages_build_output_dir = "public"
compatibility_date = "2026-06-01"

# Public, non-secret settings (production).
[vars]
APP_ORIGIN = "https://stalak.app"
PADDLE_ENV = "sandbox"             # switch to "production" once Paddle has approved the account
PADDLE_CLIENT_TOKEN = "test_6ba61e76a40fdce6b9d25c3eb9a"           # client-side token: test_... (sandbox) or live_... (production)
PADDLE_PRICE_MONTH = "pri_01m5ygermd2pjw66mgdsh4f4rw"            # first offer, Stalak Pro 9.99 EUR / month: kept, its subscribers stay Pro
PADDLE_PRICE_YEAR = "pri_01m5ygfwqdq8h2ax297c6qagjs"             # first offer, Stalak Pro 79 EUR / year: kept, its subscribers stay Pro
# Offer of 30/10/2026 (evening), in dollars (Paddle converts them and adds the VAT of the country); sandbox prices made by
# the Chef de projet on 30/10 (docs/STATUS.md, BACKEND.md step 14). Empty = that plan cannot be bought yet (« Bientôt »).
PADDLE_PRICE_PRO_MONTH = "pri_01m671bncd9qm3dqxjyqf127gn"         # Stalak Pro 7.99 USD / month
PADDLE_PRICE_PRO_YEAR = "pri_01m671cexysycbr7wz1av55cvy"          # Stalak Pro 49.99 USD / year
PADDLE_PRICE_CREATOR_MONTH = "pri_01m671dtkv0d5m0r2a4ek02a3e"     # Stalak Creator Plus 14.99 USD / month
PADDLE_PRICE_CREATOR_YEAR = "pri_01m671eex11hq295vhmsj723wm"      # Stalak Creator Plus 99.99 USD / year
# Older prices of 30/10 (test subscriptions only), still recognised so their subscribers keep their price:
# Basic and Pro in euros → pro, Max → creator. Format: id:plan:interval, comma between them.
PADDLE_PRICES_OLD = "pri_01m66r80jxszc4yxggqvwak5p5:pro:month,pri_01m66r8g1bhvhnk6x1z9m0x894:pro:year,pri_01m66r4d7mtzps3wmycfmv8pk9:pro:month,pri_01m66r5nakxvg6cxjcgc1vv7j7:pro:year,pri_01m66r9m12ckfttnrr5h3vhfgc:creator:month,pri_01m66r9tmrfg7fxfrb5dpnk5s3:creator:year"
SOCIAL_CONNECT_ENABLED = "0"
ADMIN_HOST = "admin.stalak.app"   # the owner's dashboard (BACKEND.md, step 13); off until the secrets ACCESS_AUD and ADMIN_EMAILS are set
ACCESS_TEAM_DOMAIN = "https://small-band-a6ef.cloudflareaccess.com"   # Cloudflare Zero Trust team (public); its keys sign the Access tokens
GOOGLE_CLIENT_ID = "912353079416-aq4ljmd2n7ijcfl92025egde3r5nhnc9.apps.googleusercontent.com"   # public; the secret GOOGLE_CLIENT_SECRET is set in Cloudflare       # TikTok / Instagram posting: not implemented, keep "0"

# Workers AI (« Paroles automatiques », Stalak Pro): the Whisper model that writes the lyrics, on env.AI.
# Nothing to create: the binding uses the account's Workers AI (10,000 free neurons a day, then the Workers Paid plan).
[ai]
binding = "AI"

# D1 database. Create it first (BACKEND.md, step 2) and paste its id below:
# a wrong id makes the Pages deployment fail.
[[d1_databases]]
binding = "DB"
database_name = "stalak"
database_id = "fc4c8647-2357-4f7e-821c-e360c861a712"
migrations_dir = "migrations"

# R2 bucket for the media of projects saved online (Stalak Pro): the song and the takes, keys u/<userId>/p/<projectId>/<fileId>.
# The bucket "stalak-media" must exist (private, no public access): a binding to a missing bucket makes the deployment fail.
# To turn online saving off, comment these 3 lines: the code then answers "cloud_unavailable" and the app shows « bientôt ».
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "stalak-media"
# Optional: CLOUD_QUOTA_BYTES (default 21474836480 = 20 GB per user) and the secret CRON_SECRET (see BACKEND.md, step 11).

# Preview deployments (branches other than main) use the same values and the same database.
# To isolate them later, add [env.preview.vars] and [[env.preview.d1_databases]] sections.
