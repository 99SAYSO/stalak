# Scheduled Worker "stalak-cloud-cleanup": the 6-month rule of online saving (see index.js and BACKEND.md, step 11).
# Separate from the Pages project; deploy it with:  npx wrangler deploy -c workers/cloud-cleanup/wrangler.toml
name = "stalak-cloud-cleanup"
main = "index.js"
compatibility_date = "2026-06-01"

[triggers]
crons = ["17 3 * * *"]   # every day at 03:17 UTC

[vars]
APP_ORIGIN = "https://stalak.app"
# The Paddle environment and prices, the same as the site's wrangler.toml (the yearly reminder of monthly subscribers needs
# them to tell monthly from yearly). Change them in both files together.
PADDLE_ENV = "production"
PADDLE_PRICE_MONTH = ""
PADDLE_PRICE_YEAR = ""
PADDLE_PRICE_PRO_MONTH = "pri_01m6gz2fm03av5gmreyh8d4n6v"
PADDLE_PRICE_PRO_YEAR = "pri_01m6gz30pd9aec87fvy833wdgj"
PADDLE_PRICE_CREATOR_MONTH = "pri_01m6gyzb1ddqj8egyahphxgtd4"
PADDLE_PRICE_CREATOR_YEAR = "pri_01m6gz1aabr7h5tyyfwkbgvjpk"
PADDLE_PRICES_OLD = ""

# The same database and bucket as the site (wrangler.toml at the root).
[[d1_databases]]
binding = "DB"
database_name = "stalak"
database_id = "fc4c8647-2357-4f7e-821c-e360c861a712"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "stalak-media"
