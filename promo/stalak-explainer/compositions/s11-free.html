<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>s11 — no download, no sign-up</title></head>
  <body>
    <template>
      <div id="root" data-composition-id="s11" data-width="1080" data-height="1920">
        <style>
          #root { position: absolute; inset: 0; overflow: hidden; }
          #n-mac { left: -20px; top: 760px; }
          #n-ph { left: 600px; top: 640px; }
          .n-st { position: absolute; left: 0; width: 1080px; text-align: center; }
          .n-st .pill { position: relative; display: inline-flex; height: 140px; padding: 0 54px; border-radius: 70px; font: 400 96px/1 "Lilita One", sans-serif; letter-spacing: 0.01em; }
          .n-st .pill b { font-weight: 400; color: #1f6fd6; }
          #n-s1 { top: 230px; } #n-s2 { top: 410px; }
        </style>
        <div class="mac" id="n-mac">
          <div class="lid"></div>
          <div class="scr"><div class="sh"><img src="assets/ui/d_edit_top.jpg" alt="Stalak in a browser on a computer: the edit" /></div></div>
          <div class="notch"></div>
          <div class="base"><i></i></div>
        </div>
        <div class="phone" id="n-ph">
          <div class="body"></div><div class="bez"></div>
          <div class="scr"><div class="sh"><img src="assets/ui/m_edit_top.jpg" alt="Stalak in a browser on a phone: the edit" /></div></div>
          <div class="isl"></div>
          <div class="sb" style="left:-8px; top:290px; height:120px"></div><div class="sb" style="left:-8px; top:440px; height:120px"></div><div class="sb" style="left:600px; top:360px; height:180px"></div>
          <div class="glare"><div class="band"><i></i></div></div>
        </div>
        <div class="n-st" id="n-s1"><div class="pill"><b>NO</b>&nbsp;DOWNLOAD.</div></div>
        <div class="n-st" id="n-s2"><div class="pill"><b>NO</b>&nbsp;SIGN-UP.</div></div>
        <script>
          (function () {
            var D = 2.150;
            var tl = gsap.timeline({ paused: true });
            tl.fromTo("#n-mac", { opacity: 0, x: -700, rotationY: 40, scale: 0.7, transformPerspective: 2000 }, { opacity: 1, x: 0, rotationY: 12, scale: 0.78, transformPerspective: 2000, duration: 0.5, ease: "expo.out" }, 0);
            tl.fromTo("#n-ph", { opacity: 0, x: 600, rotationY: -40, scale: 0.5, transformPerspective: 1600 }, { opacity: 1, x: 0, rotationY: -14, scale: 0.56, transformPerspective: 1600, duration: 0.5, ease: "expo.out" }, 0.06);
            tl.fromTo("#n-mac", { y: 0 }, { y: -30, duration: D - 0.5, ease: "sine.inOut", immediateRender: false }, 0.5);
            tl.fromTo("#n-ph", { y: 0 }, { y: 30, duration: D - 0.5, ease: "sine.inOut", immediateRender: false }, 0.5);
            KIT.glare(tl, "#n-ph", 0.6);
            // two stamps, on the two words of the voice
            [["#n-s1 .pill", 0.18], ["#n-s2 .pill", 0.86]].forEach(function (s) {
              tl.fromTo(s[0], { opacity: 0, scale: 2.2, rotation: -6, filter: "blur(12px)" }, { opacity: 1, scale: 1, rotation: 0, filter: "blur(0px)", duration: 0.24, ease: "expo.out" }, s[1]);
              tl.set(s[0], { y: 10 }, s[1] + 0.24); tl.set(s[0], { y: -6 }, s[1] + 0.27); tl.set(s[0], { y: 0 }, s[1] + 0.3);
            });
            tl.to("#n-mac", { x: -900, opacity: 0, duration: 0.3, ease: "power3.in" }, D - 0.32);
            tl.to("#n-ph", { x: -300, scale: 0.8, duration: 0.32, ease: "power3.inOut" }, D - 0.32);
            KIT.out(tl, "#n-s1, #n-s2", D - 0.3, 0.2);
            window.__timelines["s11"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
