            var blocks = document.querySelectorAll("#e-igloo .eb"), N = blocks.length, STEPS = 40;

              var p = s / STEPS, t = P0 + (P1 - P0) * (0.5 - Math.cos(Math.PI * p) / 2);
              tl.set("#e-pct", { textContent: Math.round(p * 100) + "%" }, t);
