<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>s05 — drop your song: the file falls into the phone, a small clock stays at 11:42</title></head>
  <body>

          #g-file { position: absolute; left: 330px; top: 640px; width: 420px; height: 128px; border-radius: 28px; background: #f5f6f8; box-shadow: 0 30px 60px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 20px; padding: 0 26px; box-sizing: border-box; opacity: 0; }

          #g-wave i { display: block; width: 6px; border-radius: 3px; background: #2f6fd6; transform: scaleY(0.1); transform-origin: 50% 50%; }
        </style>
        <div id="g-clock">11:42 PM</div>
        <div class="ln" id="g-l1"><span class="w">Drop</span> <span class="w">your</span> <span class="w b">song.</span></div>
        <div id="g-file"><i><svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" fill="#fff"/><circle cx="16.5" cy="16" r="2.5" fill="#fff"/></svg></i><div><b>neva die</b><span>your song · MP3</span></div></div>
        <div id="g-wave"></div>
        <script>
          (function () {
            var T = window.T, S0 = T.S["s05-song"][0], L4 = T.L[4][0];
            function at(ft) { return ft - S0; }
            var wave = document.getElementById("g-wave"), seed = 5, rnd = function () { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
            for (var i = 0; i < 48; i++) { var b = document.createElement("i"); b.style.height = (18 + rnd() * 70) + "px"; wave.appendChild(b); }
            var tl = gsap.timeline({ paused: true });
            tl.to("#g-clock", { opacity: 1, duration: 0.2 }, at(L4) - 0.2);
            KT.words(tl, "#g-l1", at(L4), 0.1);
            // the file drops from the top into the phone's screen and lands on the beat of "song"
            tl.fromTo("#g-file", { opacity: 1, y: -700, rotation: -8, scale: 1.1 }, { y: 0, rotation: 0, scale: 1, duration: 0.42, ease: "power3.in", immediateRender: false }, at(L4) + 0.05);
            tl.to("#g-file", { scale: 0.92, duration: 0.08, yoyo: true, repeat: 1 }, at(L4) + 0.47);
            // its waveform unrolls under it (the app's loaded state appears on the screen at the same time)
            tl.to("#g-wave", { opacity: 1, duration: 0.1 }, at(L4) + 0.55);
            tl.to("#g-wave i", { scaleY: 1, duration: 0.25, ease: "back.out(1.4)", stagger: 0.012 }, at(L4) + 0.55);
            // leave: the file and wave slide into the screen as the phone turns to profile
            tl.to("#g-file, #g-wave", { opacity: 0, scale: 0.6, duration: 0.25, ease: "power3.in" }, at(T.L[5][0]) - 0.3);
            KT.out(tl, "#g-l1", at(T.L[5][0]) - 0.22);
            window.__timelines["s05"] = tl;
          })();
        </script>
