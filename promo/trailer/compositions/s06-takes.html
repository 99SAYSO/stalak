<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>s06 — add your takes: the three takes orbit the word</title></head>
  <body>
    <template>
      <div id="root" data-composition-id="s06" data-width="1080" data-height="1920">
        <style>
          #root { position: absolute; inset: 0; overflow: hidden; }
          #k-clock { position: absolute; left: 80px; top: 180px; width: 920px; text-align: center; font: 600 36px/1 "TikTok Sans", sans-serif; color: rgba(245,246,248,0.7); letter-spacing: 0.08em; }
          #k-l1 { top: 250px; } #k-l1 .w { font-size: 96px; }
          #k-orbit { position: absolute; left: 540px; top: 900px; width: 0; height: 0; perspective: 7000px; }
          #k-ring { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }
          .k-c { position: absolute; left: -156px; top: -277px; transform-style: preserve-3d; }
          .k-c .card { left: 0; top: 0; width: 312px; height: 554px; }
          .k-c b { position: absolute; left: 14px; top: 14px; width: 60px; height: 60px; border-radius: 50%; font: 800 32px/60px "TikTok Sans", sans-serif; color: #fff; text-align: center; }
        </style>
        <div id="k-clock">11:42 PM</div>
        <div class="ln" id="k-l1"><span class="w">Add</span> <span class="w">your</span> <span class="w b">takes.</span></div>
        <div id="k-orbit" data-layout-allow-overflow><div id="k-ring">
          <div class="k-c" id="k-c1"><div class="card"><img src="assets/stills/t1_000.jpg" alt="Take 1" /></div><b style="background:#d6336c">1</b></div>
          <div class="k-c" id="k-c2"><div class="card"><img src="assets/stills/t2_000.jpg" alt="Take 2" /></div><b style="background:#3a6fe0">2</b></div>
          <div class="k-c" id="k-c3"><div class="card"><img src="assets/stills/t3_000.jpg" alt="Take 3" /></div><b style="background:#e0952c">3</b></div>
        </div></div>
        <script>
          (function () {
            var T = window.T, S0 = T.S["s06-takes"][0], L5 = T.L[5][0], L6 = T.L[6][0];
            function at(ft) { return ft - S0; }
            var tl = gsap.timeline({ paused: true });
            KT.words(tl, "#k-l1", at(L5), 0.1);
            // three cards fly in from three sides and settle on the orbit, which then turns (2.2 s per turn); the ring is tilted 28 degrees
            var R = 300, cards = ["#k-c1", "#k-c2", "#k-c3"];
            cards.forEach(function (c, i) {
              var a = i * 120;
              tl.set(c, { rotationY: a, z: 0, transformOrigin: "50% 50% " + (-R) + "px" }, 0);
              tl.fromTo(c, { opacity: 0, scale: 0.3, y: [-900, 700, -900][i], x: [-500, 0, 500][i] }, { opacity: 1, scale: 1, y: 0, x: 0, duration: 0.45, ease: "back.out(1.3)", immediateRender: false }, at(L5) + 0.05 + i * 0.08);
            });
            tl.set("#k-ring", { rotationX: 22, transformPerspective: 7000 }, 0);
            tl.set(".k-c", { transformOrigin: "50% 50% " + (-R) + "px" }, 0);
            tl.fromTo("#k-ring", { rotationY: 0 }, { rotationY: 360, duration: 2.2, ease: "none", immediateRender: false }, at(L5) + 0.1);
            tl.fromTo("#k-ring", { rotationY: 0 }, { rotationY: 360, duration: 2.2, ease: "none", immediateRender: false }, at(L5) + 2.3);
            // the cards straighten, land in a row and tip flat: they become the timeline of the next scene
            tl.to("#k-ring", { rotationX: 74, scale: 0.7, y: 300, opacity: 0, duration: 0.32, ease: "power3.in" }, at(L6) - 0.3);
            KT.out(tl, "#k-l1", at(L6) - 0.25);
            window.__timelines["s06"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
