          (function () {
            var S0 = 10.95, BT = window.BEAT;
            function at(ft) { return ft - S0; }
            var tl = gsap.timeline({ paused: true });
            // the cards' row becomes the timeline: it lands flat, in perspective
            tl.fromTo("#b-plane", { opacity: 0, rotationX: 74, y: -120, scale: 0.8, transformPerspective: 1500, transformOrigin: "50% 40%" },

            // the bass comes back: one cut per beat, an ice blade, the shot takes its take's colour, shards fly
            var CUTS = [297, 477, 657, 1016, 1195, 1375];
            KIT.slam(tl, "#b-t2 .w", at(BT.bassIn) - 0.02);
            tl.set("#b-s0", { opacity: 1 }, at(BT.bassIn) - 0.04);
            CUTS.forEach(function (x, i) {
              var t = at(BT.beat(22 + i)), k = "#b-k" + (i + 1), sh = "#b-x" + (i + 1);
              tl.fromTo(k, { opacity: 1, y: -260, scaleY: 1.3 }, { y: 0, scaleY: 1, duration: 0.07, ease: "power3.in", immediateRender: false }, t - 0.07);
              tl.to(k, { opacity: 0, scaleX: 3, duration: 0.18, ease: "power2.out" }, t + 0.02);
              tl.set("#b-s" + (i + 1), { opacity: 1 }, t);
              tl.fromTo("#b-s" + (i + 1), { filter: "brightness(2.2)" }, { filter: "brightness(1)", duration: 0.22, ease: "power2.out", immediateRender: false }, t);
              document.querySelectorAll(sh + " i").forEach(function (p, j) {
                var a = (j / 6) * Math.PI * 2 + i, d = 90 + (j % 3) * 40;
