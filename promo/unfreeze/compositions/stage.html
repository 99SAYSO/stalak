<!doctype html>
<html lang="en">

  </head>
  <body>
    <style>

    <script>
      // One linear clock drives the whole 3D world: every frame is render(t), t in film seconds.

        var D = 28;
        var tl = gsap.timeline({ paused: true });
        tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: function () { if (host.render) host.render(clock.t); } });
        window.__timelines = window.__timelines || {};

      })();
    </script>
    <script type="module">
      import * as THREE from "./assets/vendor/three/three.module.min.js";
      import { GLTFLoader } from "./assets/vendor/three/GLTFLoader.js";
      import { mergeVertices } from "./assets/vendor/three/BufferGeometryUtils.js";
      import { ConvexGeometry } from "./assets/vendor/three/ConvexGeometry.js";
      import { SimplexNoise } from "./assets/vendor/three/SimplexNoise.js";
      import { FullScreenQuad } from "./assets/vendor/three/Pass.js";

      const host = window.__stage, BT = window.BEAT;
      const W = 1080, H = 1920;
      const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
      const lerp = (a, b, k) => a + (b - a) * k;

      const eBack = (k) => { const c1 = 1.6, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };

      function softCap(s, d, r) { const a = d - r; return s <= a ? s : a + r * (1 - Math.exp(-(s - a) / r)); }
      const col = (hex) => new THREE.Color(hex);

      renderer.setPixelRatio(1);

      const camera = new THREE.PerspectiveCamera(40, W / H, 0.05, 90);

      // ---------- procedural textures (seeded): micro-relief of the ice, frost, glows ----------
      function tileFbm(N, u, v, octs) {
        let h = 0; const A = u * 6.283185, B = v * 6.283185;
        for (const [f, a, ridge] of octs) { let n = N.noise4d(Math.cos(A) * f, Math.sin(A) * f, Math.cos(B) * f, Math.sin(B) * f); if (ridge) n = 1 - 2 * Math.abs(n); h += n * a; }

      function normalTex(F, size, strength, rep) {

        const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); t.anisotropy = 4; return t;
      }

      const iceNormal = normalTex(hIce, 256, 3.2, [2, 2]);
      const iceNormalWall = normalTex(heightField(256, 23, [[1.2, 1.0, true], [3, 0.5], [7, 0.25, true], [16, 0.1]]), 256, 5.0, [7, 4]);
      // the block's faces: clear in the middle, frost creeping in from the edges (R: light that goes through, G: roughness)
      const blockTex = (function () {
        const S = 512, NB = new SimplexNoise({ random: rng(304) }), cv = document.createElement("canvas"); cv.width = cv.height = S; const c = cv.getContext("2d"), img = c.createImageData(S, S);
        for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {

          const n1 = NB.noise(u * 6, v * 6), n2 = NB.noise(u * 21 + 5, v * 21), n3 = NB.noise(u * 64, v * 64 + 9);
          let f = sstep(0.7 + 0.12 * n1, 1.0, e + 0.05 * n2) + 0.22 * sstep(0.4, 0.9, n1) * sstep(0.45, 0.85, e);

      })();

      const dotTex = radialTex(64, [[0, 1], [0.35, 0.65], [1, 0]]);

      // ---------- the sky: a cold gradient all around, brightest high up where the light comes from ----------
      const SUN = V(-0.42, 0.8, -0.43).normalize();
      function skyMat(boost, rays) {
        return new THREE.ShaderMaterial({
          uniforms: { cTop: { value: col(0xd4ecff) }, cHi: { value: col(0x5aa8f7) }, cMid: { value: col(0x1f6fd6) }, cLo: { value: col(0x0e48a6) }, cBot: { value: col(0x051c4f) }, cSun: { value: col(0xeaf6ff) }, sun: { value: SUN }, boost: { value: boost },
            rays: { value: rays }, time: { value: 0 } },
          vertexShader: "varying vec3 vDir; void main() { vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
          fragmentShader: "uniform vec3 cTop, cHi, cMid, cLo, cBot, cSun, sun; uniform float boost, rays, time; varying vec3 vDir;\n" +
            "void main() { vec3 d = normalize(vDir); float y = d.y; vec3 c;\n" +
            "  if (y > 0.0) { c = mix(cMid, cHi, smoothstep(0.0, 0.42, y)); c = mix(c, cTop, smoothstep(0.42, 0.98, y)); }\n" +
            "  else { c = mix(cMid, cLo, smoothstep(0.0, 0.34, -y)); c = mix(c, cBot, smoothstep(0.34, 0.95, -y)); }\n" +
            "  float s = max(dot(d, sun), 0.0); c += cSun * (pow(s, 5.0) * 0.32 + pow(s, 48.0) * 1.4);\n" +
            "  vec3 u0 = normalize(cross(sun, vec3(0.0, 0.0, 1.0))), w0 = cross(sun, u0); float ph = atan(dot(d, w0), dot(d, u0)), th = 1.0 - dot(d, sun);\n" +
            "  float band = pow(0.5 + 0.5 * sin(ph * 31.0 + 1.7 * sin(ph * 9.0) + time * 0.05), 5.0) * 0.7 + pow(0.5 + 0.5 * sin(ph * 13.0 - 2.1 + time * 0.03), 8.0) * 0.5;\n" +

      const dome = new THREE.Mesh(new THREE.SphereGeometry(80, 48, 32), skyMat(1.0, 0.035)); dome.renderOrder = -10; scene.add(dome);

      // ---------- the light: a studio of softboxes for the reflections, a warm key, a cold rim ----------
      const pmrem = new THREE.PMREMGenerator(renderer);
      const envScene = new THREE.Scene();
      envScene.add(new THREE.Mesh(new THREE.SphereGeometry(10, 32, 16), skyMat(1.25, 0)));
      function softbox(w, h, p, k, hex) { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: col(hex).multiplyScalar(k), side: THREE.DoubleSide, fog: false })); m.position.copy(p); m.lookAt(0, 0, 0); envScene.add(m); }

      softbox(1.3, 7.5, V(6.2, 2.4, -4.2), 9.0, 0xcfeaff);    // rim strip, right, behind
      softbox(9.0, 1.1, V(0.4, 8.6, -1.2), 4.0, 0xeaf6ff);    // a long strip right above
      softbox(1.1, 4.5, V(-7.2, 0.6, -2.4), 3.2, 0xbfe0ff);   // a thin one far left, behind
      softbox(5.0, 1.0, V(2.2, -6.2, 4.0), 1.1, 0x6fb0ff);    // a faint bounce from below

      scene.environmentIntensity = 1.0;
      const key = new THREE.DirectionalLight(0xfff0de, 2.4); key.position.set(-3, 5, 4); scene.add(key);
      const rim = new THREE.DirectionalLight(0xbfe4ff, 3.4); rim.position.set(3.5, 2.5, -4); scene.add(rim);
      scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x0b2f78, 0.3));

      // ---------- the ice of the world: a light shader (the sky bent through the ice, one bounce inside, reflections, glints of the lights) ----------
      const ENV = scene.environment;
      const CUBEUV = (() => { const h = ENV.image.height, n = Math.log2(h) - 2; return { ENVMAP_TYPE_CUBE_UV: "", CUBEUV_TEXEL_WIDTH: 1 / (3 * Math.max(Math.pow(2, n), 112)), CUBEUV_TEXEL_HEIGHT: 1 / h, CUBEUV_MAX_MIP: n.toFixed(1) }; })();
      const ICE_VS = "#include <common>\n#include <fog_pars_vertex>\nvarying vec3 vWp; varying vec3 vWn; varying vec3 vOp;\n" +
        "void main() { vec4 p = vec4(position, 1.0); vec3 n = normal;\n#ifdef USE_INSTANCING\n p = instanceMatrix * p; n = mat3(instanceMatrix) * n;\n#endif\n" +
        " vec4 wp = modelMatrix * p; vWp = wp.xyz; vWn = normalize(mat3(modelMatrix) * n); vOp = position; vec4 mvPosition = viewMatrix * wp; gl_Position = projectionMatrix * mvPosition;\n#include <fog_vertex>\n}";
      const ICE_FS = "#include <common>\n#include <cube_uv_reflection_fragment>\n#include <fog_pars_fragment>\n" +
        "uniform sampler2D envMap; uniform vec3 tint, keyDir, keyCol, rimDir, rimCol; uniform float ior, thick, milky, rough, glint, through, bright, clearness, frostRim; varying vec3 vWp; varying vec3 vWn; varying vec3 vOp;\n" +
        "void main() {\n" +
        "  vec3 n = normalize(vWn); n = normalize(n + 0.05 * vec3(sin(vOp.y * 17.0 + vOp.z * 9.0), sin(vOp.z * 15.0 + vOp.x * 11.0), sin(vOp.x * 13.0 + vOp.y * 8.0)));\n" +
        "  vec3 v = normalize(cameraPosition - vWp); float ndv = clamp(dot(n, v), 0.0, 1.0); float F = 0.04 + 0.96 * pow(1.0 - ndv, 5.0);\n" +

        "  vec3 c = mix(behind * through, inside, 0.5) * pow(tint, vec3(thick * (0.25 + ndv)));\n" +

        "  c += frostRim * pow(1.0 - ndv, 2.5) * vec3(0.85, 0.93, 1.0) + milky * pow(ndv, 2.0) * vec3(0.8, 0.9, 1.0);\n" +

        "  gl_FragColor = vec4(c, 1.0);\n#include <fog_fragment>\n}";
      function iceMat(o) {
        const m = new THREE.ShaderMaterial({ defines: CUBEUV, vertexShader: ICE_VS, fragmentShader: ICE_FS, fog: true,
          uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, { tint: { value: col(o.tint) }, keyDir: { value: key.position.clone().normalize() }, keyCol: { value: col(0xfff0de) },
            rimDir: { value: rim.position.clone().normalize() }, rimCol: { value: col(0xbfe4ff) }, ior: { value: o.ior || 1.33 }, thick: { value: o.thick }, milky: { value: o.milky },
            rough: { value: o.rough }, glint: { value: o.glint || 2.5 }, through: { value: o.through || 1.0 }, bright: { value: o.bright || 1.0 },
            clearness: { value: o.clear == null ? 0.38 : o.clear }, frostRim: { value: o.rim == null ? 0.45 : o.rim } }]) });

      }
      const iceClear = iceMat({ tint: 0xd4ebff, thick: 0.9, milky: 0.12, rough: 0.04, bright: 1.12 });
      const iceFrosted = iceMat({ tint: 0xe6f3ff, thick: 0.7, milky: 0.5, rough: 0.34, glint: 1.2, rim: 0.7, bright: 1.15 });
      const iceGiant = iceMat({ tint: 0xa9d5ff, thick: 2.0, milky: 0.08, rough: 0.1, clear: 0.2 });

      // an ice chunk: a sphere cut by random planes (flat broken faces, melted round edges), then a little uneven

      // ---------- the ice world: floating chunks of real ice along the camera's path, giants far away ----------
      const world = new THREE.Group(); scene.add(world);
      const R = rng(1709), props = [];
      for (let i = 0; i < 40; i++) {
        const front = i < 4, z = front ? 3.4 - i * 0.45 : -1.2 - (i - 4) * 0.62 - R() * 0.4;

      for (let i = 0; i < 9; i++) {   // giants: big and far, deep blue with their thickness, blurred by the lens
        const m = new THREE.Mesh(chunkGeos[(i * 3 + 1) % 8], iceGiant), side = i % 2 ? 1 : -1;
        m.position.set(side * (4.5 + R() * 5), -2.5 + R() * 8, -20 - i * 3.6 - R() * 2); m.scale.setScalar(1.6 + R() * 2.4); m.rotation.set(R() * 6, R() * 6, R() * 6);
        world.add(m);
      }
      // fine ice dust that catches the light
      function dustCloud(n, seed, box) { const Rd = rng(seed), p = new Float32Array(n * 3), base = [];
        for (let i = 0; i < n; i++) { const b = [box[0] + Rd() * (box[1] - box[0]), box[2] + Rd() * (box[3] - box[2]), box[4] + Rd() * (box[5] - box[4]), Rd()]; base.push(b); p.set(b.slice(0, 3), i * 3); }
        const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(p, 3));
        const pts = new THREE.Points(g, new THREE.PointsMaterial({ map: dotTex, color: 0xeaf6ff, size: 0.022, sizeAttenuation: true, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending, depthWrite: false }));

      }
      function driftDust(pts, t) { const a = pts.geometry.attributes.position, { base, box } = pts.userData, hgt = box[3] - box[2];
        for (let i = 0; i < base.length; i++) { const b = base[i]; let y = b[1] - 0.07 * t - b[3] * 0.05 * t; y = box[2] + ((((y - box[2]) % hgt) + hgt) % hgt); a.setXYZ(i, b[0] + Math.sin(t * 0.4 + b[3] * 9) * 0.06, y, b[2]); }

        "  float d = 0.24, np = 1.0 - d * d / (pk + d - 0.76); c *= np / pk; float g = 1.0 - 1.0 / (0.15 * (pk - np) + 1.0); return mix(c, vec3(np), g); }\n" +
        "float lu(vec3 c) { return dot(c / (1.0 + c), vec3(0.299, 0.587, 0.114)); }\n" +
        "vec3 fxaa(vec2 uv) { vec3 nw = texture2D(tColor, uv + vec2(-1.0, -1.0) * texel).rgb, ne = texture2D(tColor, uv + vec2(1.0, -1.0) * texel).rgb, sw = texture2D(tColor, uv + vec2(-1.0, 1.0) * texel).rgb,\n" +
        "  se = texture2D(tColor, uv + vec2(1.0, 1.0) * texel).rgb, m = texture2D(tColor, uv).rgb; float lnw = lu(nw), lne = lu(ne), lsw = lu(sw), lse = lu(se), lm = lu(m);\n" +
        "  float lmin = min(lm, min(min(lnw, lne), min(lsw, lse))), lmax = max(lm, max(max(lnw, lne), max(lsw, lse))); if (lmax - lmin < 0.03) return m;\n" +
        "  vec2 dir = vec2(-((lnw + lne) - (lsw + lse)), (lnw + lsw) - (lne + lse)); float red = max((lnw + lne + lsw + lse) * 0.03125, 1.0 / 128.0);\n" +
        "  dir = clamp(dir / (min(abs(dir.x), abs(dir.y)) + red), vec2(-8.0), vec2(8.0)) * texel;\n" +
        "  vec3 a = 0.5 * (texture2D(tColor, uv + dir * (-1.0 / 6.0)).rgb + texture2D(tColor, uv + dir * (1.0 / 6.0)).rgb);\n" +
        "  vec3 b = a * 0.5 + 0.25 * (texture2D(tColor, uv - dir * 0.5).rgb + texture2D(tColor, uv + dir * 0.5).rgb); float lb = lu(b); return (lb < lmin || lb > lmax) ? a : b; }\n" +
        "void main() { float d = -perspectiveDepthToViewZ(texture2D(tDepth, vUv).x, cNear, cFar); float m = smoothstep(0.6, 2.6, coc(d));\n" +
        "  vec3 c = m < 0.999 ? fxaa(vUv) : vec3(0.0); c = mix(c, texture2D(tDof, vUv).rgb, m) + texture2D(tB1, vUv).rgb * glow1 + texture2D(tB2, vUv).rgb * glow2;\n" +
        "  c = tm(c); c = mix(c * 12.92, 1.055 * pow(max(c, vec3(0.0)), vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c));\n" +
        "  vec2 q = (vUv - vec2(0.5, 0.55)) * vec2(1.0, 1.7778); c *= 1.0 - vig * smoothstep(0.4, 1.1, length(q)); c = mix(c, vec3(1.0), flash);\n" +
        "  c += (fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715)))) - 0.5) / 255.0; gl_FragColor = vec4(c, 1.0); }",
        Object.assign({ tColor: { value: sceneRT.texture }, tDepth: { value: sceneRT.depthTexture }, tDof: { value: halfB.texture }, tB1: { value: q1.texture }, tB2: { value: e1.texture },
          texel: { value: new THREE.Vector2(1 / W, 1 / H) }, exposure: { value: 1.0 }, glow1: { value: 0.32 }, glow2: { value: 0.22 }, flash: { value: 0 }, vig: { value: 0.3 } }, LENS));
      function pass(q, target) { renderer.setRenderTarget(target); q.render(renderer); }
      function blur(src, dst, tmp, w, h) {
        qBlur.material.uniforms.tSrc.value = src.texture; qBlur.material.uniforms.dir.value.set(1 / w, 0); pass(qBlur, tmp);
        qBlur.material.uniforms.tSrc.value = tmp.texture; qBlur.material.uniforms.dir.value.set(0, 1 / h); pass(qBlur, dst);
      }
      function lensRender() {
        renderer.setRenderTarget(sceneRT); renderer.render(scene, camera);
        pass(qDown, halfA); pass(qDof, halfB);
        pass(qBright, q1); blur(q1, q1, q2, W / 4, H / 4);
        qCopy.material.uniforms.tSrc.value = q1.texture; pass(qCopy, e1); blur(e1, e1, e2, W / 8, H / 8);
        pass(qFinal, null);
      }
      const lens = { u: LENS, fin: qFinal.material.uniforms };

      // ---------- the camera's journey ----------
      const PUSHES = [BT.song, BT.takes, BT.timeline, BT.done, BT.shuffle, BT.reviews, BT.end];
      function travel(t) {   // how far the camera has flown into the world after the explosion
        let z = 0.25 * Math.max(0, Math.min(t, BT.end + 0.6) - BT.open);
        PUSHES.forEach((p) => { z += 1.35 * eIO3(seg(t, p - 0.2, p + 0.32)); });
        return z;
      }
      const END_TRAVEL = travel(BT.end + 0.6), END_S = 0.75, END_Z = 0.8 - END_TRAVEL, END_Y = BCY - 0.03;
      const IN_CAVE = 2.0;

      host.render = function (t) {
        // the world drifts slowly; every chunk turns and bobs on its own
        props.forEach((o) => { o.m.rotation.set(o.ax + o.sx * t, o.ay + o.sy * t, 0); o.m.position.y = o.y + Math.sin(o.bob + t * 0.5) * 0.05; });
        let camPos = new THREE.Vector3(), look = new THREE.Vector3(), fov = 40, focus = 5.2, cocK = 38, flash = 0;
        const hook = t < IN_CAVE, inCave = t >= IN_CAVE && t < BT.boom, tr = travel(t);
        if (t < BT.crack) {                       // 1. the camera turns slowly round the frozen mascot and closes in
          const a = -0.24 + 0.14 * t, r = 5.85 - 0.2 * t;
          camPos.set(Math.sin(a) * r, BCY + 0.08 + 0.04 * Math.sin(t), Math.cos(a) * r); look.set(0, BCY + 0.12, 0);
          focus = r - BD / 2;
        } else if (t < IN_CAVE) {                 // 2. it dives into the crack; the light inside floods the lens
          const k = eIn3(seg(t, BT.crack, IN_CAVE)), a = -0.24 + 0.14 * BT.crack, r = 5.85 - 0.2 * BT.crack;
          const from = new THREE.Vector3(Math.sin(a) * r, BCY + 0.08 + 0.04 * Math.sin(BT.crack), Math.cos(a) * r), to = CRACK_PT.clone().add(new THREE.Vector3(0, 0, 0.12));
          camPos.copy(from).lerp(to, k); look.set(0, BCY + 0.12, 0).lerp(CRACK_PT, k); fov = 40 + 25 * k;
          focus = Math.max(0.12, camPos.distanceTo(CRACK_PT));
          flash = 0.92 * sstep(1.9, 1.995, t);
        } else if (inCave) {                      // 3. inside the crevasse: the camera glides on toward the light; a jolt on every cut
          const e = eOut3(seg(t, IN_CAVE, 2.7)), k = seg(t, IN_CAVE, BT.boom);
          let jolt = 0; BT.cuts.forEach((c) => { const u = t - c; if (u >= 0 && u < 0.25) jolt += Math.sin(u * 60) * 0.012 * (1 - u / 0.25); });
          camPos.set(CAVE_X + Math.sin(t * 2.1) * 0.03 + jolt, 0.12 + 0.05 * Math.sin(t * 1.3) + jolt * 0.6, 2.2 - 1.3 * e - 0.55 * k);
          look.set(CAVE_X + 0.03 * Math.sin(t * 0.9), 0.62, -10); fov = 54 - 9 * e;
          focus = 4.0; cocK = 30;
          flash = 0.92 * (1 - sstep(IN_CAVE, 2.2, t));
        } else {                                  // 4. front view for the explosion, then the flight through the ice world
          const shake = t >= BT.boom && t < BT.boom + 0.12 ? (Math.sin(t * 190) * 0.06) : 0;
          const ramp = seg(t, BT.open + 0.3, BT.open + 1.5), sway = Math.sin(t * 0.35) * 0.14 * ramp;
          camPos.set(sway + shake, BCY + Math.sin(t * 0.27) * 0.08 * ramp, 5.6 - tr); look.set(sway * 0.5, BCY, -0.4 - tr);
          focus = 5.1;
          if (t > BT.freeze) {                     // the loop: back to the framing of the first frame, around the new block
            const k = eIO2(seg(t, BT.freeze, BT.total)), sg = END_S / 1.32, pb = new THREE.Vector3(0, END_Y - 0.06 * sg, END_Z);
            const a0 = -0.24, c0 = new THREE.Vector3(Math.sin(a0) * 5.85, BCY + 0.08, Math.cos(a0) * 5.85).multiplyScalar(sg).add(pb);
            const l0 = new THREE.Vector3(0, BCY + 0.12, 0).multiplyScalar(sg).add(pb);
            camPos.lerp(c0, k); look.lerp(l0, k);
          }
        }
        camera.position.copy(camPos); camera.fov = fov; camera.updateProjectionMatrix(); camera.lookAt(look);
        dome.position.copy(camPos);

        // what exists when: the world (not in the crevasse), the crevasse (only inside the crack), the block (until the dive ends)
        world.visible = !inCave; cave.visible = inCave;
        dome.material.uniforms.time.value = t;
        if (!inCave) driftDust(dust, t);
        block.visible = hook;
        if (hook) {
          drawCracks(seg(t, 0.35, BT.crack));
          const kl = seg(t, 1.55, IN_CAVE); leak.material.opacity = sstep(0, 1, kl); leak.scale.setScalar(0.05 + 0.9 * kl * kl);
        }
        // the crevasse: the walls part on the downbeat and the light pours in
        caveLight.intensity = inCave ? 10 + 60 * eIn3(seg(t, BT.boom - 0.3, BT.boom)) : 0;
        key.intensity = inCave ? 0.7 : 2.4; rim.intensity = inCave ? 1.2 : 3.4;
        if (inCave) {
          const op = eIn3(seg(t, BT.boom - 0.24, BT.boom)); wallL.position.x = -3.4 * op; wallR.position.x = 3.4 * op;
          exitGlow.scale.setScalar(1 + 2.2 * op); exitGlow.material.opacity = 0.85 + 0.15 * Math.sin(t * 3.1);
          driftDust(caveDust, t);
        }

        // the shards: burst at the explosion, fly, then gather into the phone's outline and melt into it
        const ts = t - BT.boom, shardsOn = ts >= 0 && t < BT.open + 0.2;
        shardMeshes.forEach((m) => { m.visible = shardsOn; });
        if (shardsOn) {
          for (let i = 0; i < NS; i++) {
            const o = S[i], fly = new THREE.Vector3(o.p.x + o.v.x * ts, o.p.y + o.v.y * ts - 3.6 * ts * ts, o.p.z + o.v.z * ts);
            const kc = eIO3(seg(t, o.conv, BT.open - 0.02));
            dummy.position.copy(fly).lerp(o.tgt, kc);
            dummy.rotation.set(o.w[0] * ts * (1 - kc), o.w[1] * ts * (1 - kc), o.w[2] * ts * (1 - kc));
            const sc = o.s * (1 - 0.55 * kc) * (1 - seg(t, BT.open, BT.open + 0.18));
            dummy.scale.set(sc * o.k[0], sc * o.k[1], sc * o.k[2]); dummy.updateMatrix(); shardMeshes[i % SK].setMatrixAt(Math.floor(i / SK), dummy.matrix);
          }
          shardMeshes.forEach((m) => { m.instanceMatrix.needsUpdate = true; });
        }
        powder.visible = ts >= 0 && ts < 1.3;
        if (powder.visible) {
          const a = powderGeo.attributes.position, dr = 1 - Math.exp(-ts * 1.6);
          for (let i = 0; i < PW; i++) { const [p, v] = pwBase[i]; a.setXYZ(i, p.x + v.x * dr / 1.6, p.y + v.y * dr / 1.6 - 0.9 * ts * ts, p.z + v.z * dr / 1.6); }
          a.needsUpdate = true; powder.material.opacity = 0.9 * (1 - sstep(0.15, 1.3, ts));
        }

        // the mascot: frozen in the block, bursts out spinning and dancing, leaves, comes back for the end, freezes again
        let mv = true, mt = FROZEN, pos = new THREE.Vector3(0, 0.06, 0), ry = 0, sc = 1.32;
        if (hook) { mt = FROZEN; }
        else if (inCave) { mv = false; }
        else if (t < BT.open) {
          const k = eOutExpo(seg(t, BT.boom, BT.boom + 0.7)), out = eIn3(seg(t, BT.boom + 0.95, BT.open - 0.05));
          mt = FROZEN + (t - BT.boom) * 1.0; ry = Math.PI * 2 * k; sc = 1.32 + 0.22 * k;
          pos.set(0 + 2.6 * out, 0.06 + 0.45 * k + 3.2 * out, 0.5 * k);
        } else if (t < BT.end + 0.2) { mv = false; }
        else {
          const drop = eBack(seg(t, BT.end + 0.25, BT.end + 0.75));
          mt = t < BT.dance ? 0.0 : Math.min(t, BT.freeze) - BT.dance;
          pos.set(0, END_Y + (1 - drop) * 3.2, END_Z); sc = END_S; ry = 0;
          focus = lerp(5.1, camPos.distanceTo(V(0, END_Y + 0.5, END_Z)), sstep(BT.end + 0.2, BT.end + 0.8, t));
          // the ice grows back around her at the very end
          block.visible = t >= BT.freeze;
          if (block.visible) { const sg = END_S / 1.32, kb = eBack(seg(t, BT.freeze, BT.freeze + 0.42)); block.position.set(0, END_Y - 0.06 * sg, END_Z); block.scale.setScalar(Math.max(0.001, sg * kb)); drawCracks(0); leak.material.opacity = 0; }
        }
        if (!(t >= BT.end)) { block.position.set(0, 0, 0); block.scale.setScalar(1); }
        mascot.visible = mv;
        if (mv) { mascot.position.copy(pos); mascot.rotation.set(0, ry, 0); mascot.scale.setScalar(sc); if (mixer) mixer.setTime(((mt % clipDur) + clipDur) % clipDur); }

        lens.u.focus.value = focus; lens.u.cocK.value = cocK; lens.fin.flash.value = flash;
        lensRender();
      };
      // compile every material once, with everything visible, so no frame waits on a shader
      cave.visible = world.visible = block.visible = powder.visible = true; shardMeshes.forEach((m) => { m.visible = true; }); caveLight.intensity = 1;
      renderer.transmissionResolutionScale = 0.6;
      renderer.compile(scene, camera);
      host.render(host.clock.t);
      host.ready();
    </script>
  </body>
