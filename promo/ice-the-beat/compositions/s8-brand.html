<!doctype html>
<html lang="en" data-composition-variables='[
    {"id":"site","type":"string","label":"Website","default":"stalak.app"},
    {"id":"handle","type":"string","label":"Social handle","default":"@stalak_app"}
  ]'>
  <head><meta charset="UTF-8" /><title>s8 — the brand</title></head>
  <body>
    <template>
      <div id="root" data-composition-id="s8" data-width="1080" data-height="1920">
        <style>
          @font-face { font-family: "Lilita One"; src: url("assets/fonts/lilitaone.ttf"); }
          @font-face { font-family: "Rubik"; src: url("assets/fonts/rubik.ttf"); font-weight: 300 900; }
          #root { position: absolute; inset: 0; overflow: hidden; background: #ffffff; }
          #s8-bg { position: absolute; inset: 0; background: #1f6fd6; clip-path: circle(0% at 50% 14%); }
          #s8-lock { position: absolute; left: 0; top: 196px; width: 1080px; height: 170px; display: flex; align-items: center; justify-content: center; gap: 22px; }
          #s8-lock .icon { width: 160px; height: 160px; filter: drop-shadow(0 10px 0 #0a0d14); }
          #s8-lock .word { width: 300px; height: auto; }
          #s8-card { position: absolute; left: 70px; top: 432px; width: 940px; height: 470px; background: #ffffff; border: 8px solid #0a0d14; border-radius: 42px; box-shadow: 0 18px 0 #0a0d14; }
          #s8-head { position: absolute; left: 0; top: 64px; width: 924px; text-align: center; font-family: "Lilita One", sans-serif; font-size: 104px; line-height: 1.04; color: #0a0d14; }
          #s8-head span { display: inline-block; }
          #s8-head .acc { color: #1f6fd6; }
          #s8-ice { position: absolute; left: 70px; top: 916px; width: 940px; height: 130px; }
          #s8-ice polygon { fill: #d6ecff; stroke: #0a0d14; stroke-width: 6; stroke-linejoin: round; }
          .hl { position: absolute; left: 0; width: 1080px; text-align: center; font-family: "Lilita One", sans-serif; color: #fff; line-height: 0.95; letter-spacing: 0.01em;
            text-shadow: 7px 0 0 #0a0d14, -7px 0 0 #0a0d14, 0 7px 0 #0a0d14, 0 -7px 0 #0a0d14, 5px 5px 0 #0a0d14, -5px 5px 0 #0a0d14, 5px -5px 0 #0a0d14, -5px -5px 0 #0a0d14, 0 16px 0 #0a0d14; }
          #s8-url { top: 1022px; font-size: 140px; }
          #s8-cta { position: absolute; left: 290px; top: 1166px; width: 500px; height: 96px; border-radius: 30px; background: #0a0d14; border: 6px solid #0a0d14; box-shadow: 0 10px 0 #000000, inset 0 4px 0 #3a4152;
            display: flex; align-items: center; justify-content: center; font: 400 62px/1 "Lilita One", sans-serif; color: #ffffff; letter-spacing: 0.01em; }
          #s8-handle { position: absolute; left: 0; top: 1280px; width: 1080px; height: 50px; display: flex; align-items: center; justify-content: center; gap: 14px;
            font: 700 42px/1 "Rubik", sans-serif; color: #ffffff; text-shadow: 0 4px 0 #0a0d14; }
          #s8-handle img { width: 40px; height: 40px; filter: invert(1) drop-shadow(0 3px 0 #ffffff); }
          #s8-handle .gap { width: 10px; }
        </style>
        <div id="s8-bg"></div>
        <div id="s8-lock"><img class="icon" src="assets/brand/icon.svg" alt="" /><img class="word" src="assets/brand/wordmark.svg" alt="Stalak" /></div>
        <div id="s8-card">
          <div id="s8-head"><span>MAKE</span> <span>YOUR</span> <span>NEXT</span><br /><span>SNIPPET</span> <span>HIT</span><br /><span class="acc">DIFFERENT.</span></div>
        </div>
        <!-- stalactites forming under the card -->
        <svg id="s8-ice" viewBox="0 0 940 130" aria-hidden="true">
          <polygon points="40,0 58,70 76,0" />
          <polygon points="104,0 118,44 132,0" />
          <polygon points="160,0 184,112 208,0" />
          <polygon points="238,0 252,52 266,0" />
          <polygon points="296,0 316,88 336,0" />
          <polygon points="366,0 380,40 394,0" />
          <polygon points="424,0 448,124 472,0" />
          <polygon points="502,0 516,56 530,0" />
          <polygon points="560,0 580,92 600,0" />
          <polygon points="630,0 644,46 658,0" />
          <polygon points="688,0 710,104 732,0" />
          <polygon points="762,0 776,50 790,0" />
          <polygon points="820,0 840,80 860,0" />
        </svg>
        <div class="hl" id="s8-url" data-var-text="site">stalak.app</div>
        <div id="s8-cta">TRY IT FREE.</div>
        <div id="s8-handle"><img src="assets/brand/instagram.svg" alt="Instagram" /><img src="assets/brand/tiktok.svg" alt="TikTok" /><span class="gap"></span><span data-var-text="handle">@stalak_app</span></div>
        <script>
          (function () {
            var tl = gsap.timeline({ paused: true });
            // the white of the window becomes the brand blue, flooding out from the logo
            tl.fromTo("#s8-bg", { clipPath: "circle(0% at 50% 14%)" }, { clipPath: "circle(150% at 50% 14%)", duration: 0.34, ease: "power2.inOut" }, 0);
            tl.fromTo("#s8-lock", { scale: 2.1, opacity: 0, filter: "blur(12px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.34, ease: "expo.out" }, 0.02);
            // top-to-bottom build, settled by 1.6 s so the site, the offer and the handle hold well over 2 s
            tl.fromTo("#s8-card", { y: -70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "expo.out" }, 0.58);
            var w = document.querySelectorAll("#s8-head span");
            tl.set(w, { opacity: 0 }, 0);
            [0.66, 0.71, 0.76, 0.84, 0.89, 0.97].forEach(function (t, i) {
              tl.fromTo(w[i], { opacity: 0, y: 26, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.16, ease: "power3.out" }, t);
            });
            // stalactites grow under the card
            tl.fromTo("#s8-ice polygon", { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, duration: 0.34, ease: "back.out(1.7)", stagger: 0.03 }, 1.0);
            // the address, the offer, the handle
            tl.fromTo("#s8-url", { scale: 1.5, opacity: 0, filter: "blur(10px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.22, ease: "expo.out" }, 1.1);
            tl.fromTo("#s8-cta", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.5)" }, 1.28);
            tl.fromTo("#s8-handle", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.22, ease: "expo.out" }, 1.42);
            // while the voice reads the line: a small pop on "hit" and on "different"
            tl.fromTo(w[4], { scale: 1 }, { scale: 1.1, duration: 0.08, ease: "power2.out", yoyo: true, repeat: 1 }, 2.06);
            tl.fromTo(w[5], { scale: 1 }, { scale: 1.12, duration: 0.09, ease: "power2.out", yoyo: true, repeat: 1 }, 2.27);
            window.__timelines["s8"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
