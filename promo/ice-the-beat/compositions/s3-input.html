<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>s3 — the input (real Stalak screens)</title></head>
  <body>
    <template>
      <div id="root" data-composition-id="s3" data-width="1080" data-height="1920">
        <style>
          @font-face { font-family: "Lilita One"; src: url("assets/fonts/lilitaone.ttf"); }
          #root { position: absolute; inset: 0; overflow: hidden; background: #1f6fd6; }
          .hl { position: absolute; left: 0; width: 1080px; text-align: center; font-family: "Lilita One", sans-serif; color: #fff; line-height: 0.95; letter-spacing: 0.01em;
            text-shadow: 7px 0 0 #0a0d14, -7px 0 0 #0a0d14, 0 7px 0 #0a0d14, 0 -7px 0 #0a0d14, 5px 5px 0 #0a0d14, -5px 5px 0 #0a0d14, 5px -5px 0 #0a0d14, -5px -5px 0 #0a0d14, 0 18px 0 #0a0d14; }
          .hl .l1 { display: block; font-size: 120px; }
          .hl .l2 { display: block; font-size: 172px; margin-top: 6px; }
          #s3-ha, #s3-hb { top: 196px; }
          /* the phone-sized window onto the real app */
          #s3-panel { position: absolute; left: 60px; top: 560px; width: 960px; height: 770px; border: 8px solid #0a0d14; border-radius: 44px; overflow: hidden; background: #1f6fd6; box-shadow: 0 18px 0 #0a0d14; }
          #s3-cam { position: absolute; inset: 0; transform-origin: 50% 58%; }
          .ui { position: absolute; left: -8px; top: 0; width: 960px; }
          .ui img { display: block; width: 960px; }
          #s3-u1 img { transform: translateY(-623px); }   /* Pick your song · Import your music */
          #s3-u2 img { transform: translateY(-890px); }   /* Change song · neva-die 157.0 BPM · Listen */
          #s3-u3 img { transform: translateY(-886px); }   /* Take 1 synced · Take 2 analyzing */
          #s3-u4 { left: 92px; top: 26px; width: 760px; }
          #s3-u4 img { width: 760px; }
          /* illustrations (not the app): the track and the three takes dropping into the real app */
          #s3-song { position: absolute; left: 360px; top: 590px; width: 360px; height: 150px; background: #d6ecff; border: 8px solid #0a0d14; border-radius: 36px; box-shadow: 0 14px 0 #0a0d14; opacity: 0; }
          #s3-song .note { position: absolute; left: 24px; top: 27px; width: 84px; height: 84px; }
          #s3-song .wave { position: absolute; left: 122px; top: 35px; width: 200px; height: 64px; }
          #s3-ring { position: absolute; left: 440px; top: 700px; width: 200px; height: 200px; border-radius: 50%; border: 10px solid #ffffff; opacity: 0; }
          .s3-mini { position: absolute; top: 640px; width: 170px; height: 302px; opacity: 0; }
          .s3-mini .scr { position: absolute; inset: 0; border: 6px solid #0a0d14; border-radius: 24px; overflow: hidden; background: #0a0d14; box-shadow: 0 12px 0 #0a0d14; }
          .s3-mini .scr img { display: block; width: 100%; height: 100%; object-fit: cover; }
          .s3-mini .bdg { position: absolute; left: -16px; top: -16px; width: 56px; height: 56px; border-radius: 50%; border: 5px solid #0a0d14; display: flex; align-items: center; justify-content: center;
            font: 400 32px/1 "Lilita One", sans-serif; color: #fff; text-shadow: 0 3px 0 #0a0d14; }
          #s3-m1 { left: 175px; } #s3-m2 { left: 455px; } #s3-m3 { left: 735px; }
        </style>
        <div class="hl" id="s3-ha"><span class="l1">ADD YOUR</span><span class="l2">SOUND.</span></div>
        <div class="hl" id="s3-hb"><span class="l1">ADD YOUR</span><span class="l2">TAKES.</span></div>
        <div id="s3-panel">
          <div id="s3-cam">
            <div class="ui" id="s3-u1"><img src="assets/ui/s1_empty.jpg" alt="Stalak, step 1: Pick your song, Import your music" /></div>
            <div class="ui" id="s3-u2"><img src="assets/ui/s1_loaded.jpg" alt="Stalak, step 1 after import: neva-die, 157.0 BPM" /></div>
            <div class="ui" id="s3-u3"><img src="assets/ui/s2_load01.jpg" alt="Stalak, step 2: Take 1 synced to the song, Take 2 analyzing" /></div>
            <div class="ui" id="s3-u4"><img src="assets/ui/s2_list.png" alt="Stalak, step 2: the three takes synced to the song" /></div>
          </div>
        </div>
        <div id="s3-ring"></div>
        <div id="s3-song" data-layout-allow-overlap>
          <svg class="note" viewBox="0 0 64 64" aria-hidden="true"><path d="M24 46a9 9 0 1 1-6-8.5V10l30-6v34a9 9 0 1 1-6-8.5V14l-18 3.6z" fill="#1f6fd6" stroke="#0a0d14" stroke-width="4" stroke-linejoin="round" /></svg>
          <div class="wave"><svg viewBox="0 0 200 64" width="200" height="64"><rect x="8" y="3.0" width="8" height="58.0" rx="3" fill="#0a0d14" /><rect x="22" y="5.1" width="8" height="53.8" rx="3" fill="#0a0d14" /><rect x="36" y="6.4" width="8" height="51.2" rx="3" fill="#0a0d14" /><rect x="50" y="4.1" width="8" height="55.9" rx="3" fill="#0a0d14" /><rect x="64" y="4.4" width="8" height="55.2" rx="3" fill="#0a0d14" /><rect x="78" y="7.4" width="8" height="49.3" rx="3" fill="#0a0d14" /><rect x="92" y="7.7" width="8" height="48.6" rx="3" fill="#0a0d14" /><rect x="106" y="7.9" width="8" height="48.3" rx="3" fill="#0a0d14" /><rect x="120" y="8.7" width="8" height="46.7" rx="3" fill="#0a0d14" /><rect x="134" y="3.1" width="8" height="57.8" rx="3" fill="#0a0d14" /><rect x="148" y="5.5" width="8" height="53.1" rx="3" fill="#0a0d14" /><rect x="162" y="7.0" width="8" height="50.0" rx="3" fill="#0a0d14" /><rect x="176" y="4.2" width="8" height="55.6" rx="3" fill="#0a0d14" /><rect x="190" y="4.3" width="8" height="55.5" rx="3" fill="#0a0d14" /></svg></div>
        </div>
        <div class="s3-mini" id="s3-m1"><div class="scr"><img src="assets/stills/t1_000.jpg" alt="" /></div><div class="bdg" style="background:#d6336c">1</div></div>
        <div class="s3-mini" id="s3-m2"><div class="scr"><img src="assets/stills/t2_000.jpg" alt="" /></div><div class="bdg" style="background:#3a6fe0">2</div></div>
        <div class="s3-mini" id="s3-m3"><div class="scr"><img src="assets/stills/t3_000.jpg" alt="" /></div><div class="bdg" style="background:#e0952c">3</div></div>
        <script>
          (function () {
            var tl = gsap.timeline({ paused: true });
            // arrive from the right, mid-whip from scene 2
            tl.fromTo("#s3-panel", { x: 1100, filter: "blur(14px)" }, { x: 0, filter: "blur(0px)", duration: 0.34, ease: "expo.out" }, 0);
            tl.fromTo("#s3-ha", { x: 900, opacity: 0, filter: "blur(12px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 0.04);
            // the screens: one state after another, as the app goes through them
            tl.set("#s3-u2, #s3-u3, #s3-u4", { opacity: 0 }, 0);
            // the song is in (on "track"): blur swap to the loaded state, then push in on the song line
            tl.to("#s3-u1", { opacity: 0, filter: "blur(8px)", duration: 0.12, ease: "power2.in" }, 0.6);
            tl.fromTo("#s3-u2", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power3.out" }, 0.66);
            tl.fromTo("#s3-cam", { scale: 1 }, { scale: 1.16, duration: 0.6, ease: "power2.inOut" }, 0.8);
            // ADD YOUR TAKES: the title and the window slide on together
            tl.to("#s3-ha", { x: -900, opacity: 0, filter: "blur(10px)", duration: 0.18, ease: "power3.in" }, 1.36);
            tl.fromTo("#s3-hb", { x: 900, opacity: 0, filter: "blur(12px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.28, ease: "expo.out" }, 1.5);
            tl.to("#s3-cam", { x: -1000, duration: 0.16, ease: "power3.in" }, 1.36);
            tl.set("#s3-u2", { opacity: 0 }, 1.52);
            tl.set("#s3-u3", { opacity: 1 }, 1.52);
            tl.fromTo("#s3-cam", { x: 1000, scale: 1 }, { x: 0, scale: 1, duration: 0.26, ease: "expo.out", immediateRender: false }, 1.52);
            // all three takes synced
            tl.to("#s3-u3", { opacity: 0, filter: "blur(8px)", duration: 0.12, ease: "power2.in" }, 2.08);
            tl.fromTo("#s3-u4", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power3.out" }, 2.14);
            // the track flies in from deep space, top right, and drops into the app as it loads the song
            tl.fromTo("#s3-song", { x: 380, y: -620, z: -700, rotationY: -55, rotationX: 25, rotation: 18, opacity: 0, transformPerspective: 1200 },
              { x: 0, y: 0, z: 0, rotationY: 0, rotationX: 0, rotation: -4, opacity: 1, transformPerspective: 1200, duration: 0.32, ease: "expo.out" }, 0.2);
            tl.to("#s3-song", { y: 150, scale: 0.35, opacity: 0, duration: 0.12, ease: "power3.in" }, 0.54);
            tl.fromTo("#s3-ring", { scale: 0.3, opacity: 1 }, { scale: 1.7, opacity: 0, duration: 0.32, ease: "expo.out", immediateRender: false }, 0.64);
            tl.fromTo("#s3-panel", { scale: 1.035 }, { scale: 1, duration: 0.26, ease: "power2.out", immediateRender: false }, 0.64);
            // the three takes fly up out of depth, one after another, and drop into the app
            [["#s3-m1", 1.58, -40, -14, -7], ["#s3-m2", 1.68, 12, 4, 2], ["#s3-m3", 1.78, 46, 16, 8]].forEach(function (m) {
              tl.fromTo(m[0], { y: 900, z: -900, rotationX: 65, rotationY: m[2], rotation: m[3], opacity: 0, transformPerspective: 1200 },
                { y: 0, z: 0, rotationX: 0, rotationY: 0, rotation: m[4], opacity: 1, transformPerspective: 1200, duration: 0.32, ease: "expo.out" }, m[1]);
            });
            tl.to("#s3-m1, #s3-m2, #s3-m3", { y: 170, scale: 0.45, opacity: 0, duration: 0.14, ease: "power3.in", stagger: 0.03 }, 2.05);
            tl.fromTo("#s3-panel", { scale: 1.03 }, { scale: 1, duration: 0.24, ease: "power2.out", immediateRender: false }, 2.16);
            window.__timelines["s3"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
