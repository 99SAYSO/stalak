<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>s7 — no download, no sign-up</title></head>
  <body>
    <template>
      <div id="root" data-composition-id="s7" data-width="1080" data-height="1920">
        <style>
          @font-face { font-family: "Lilita One"; src: url("assets/fonts/lilitaone.ttf"); }
          @font-face { font-family: "Rubik"; src: url("assets/fonts/rubik.ttf"); font-weight: 300 900; }
          #root { position: absolute; inset: 0; overflow: hidden; background: #1f6fd6; }
          /* a plain browser window: the web is where Stalak runs (not a picture of the app) */
          #s7-win { position: absolute; left: 60px; top: 540px; width: 960px; height: 640px; background: #ffffff; border: 8px solid #0a0d14; border-radius: 40px; box-shadow: 0 20px 0 #0a0d14; transform-origin: 50% 50%; }
          #s7-bar { position: absolute; left: 0; top: 0; right: 0; height: 104px; border-bottom: 6px solid #0a0d14; background: #eef7ff; border-radius: 32px 32px 0 0; }
          .dot { position: absolute; top: 34px; width: 30px; height: 30px; border-radius: 50%; border: 5px solid #0a0d14; background: #ffffff; }
          #s7-url { position: absolute; left: 182px; right: 34px; top: 22px; height: 58px; border-radius: 99px; border: 5px solid #0a0d14; background: #ffffff; display: flex; align-items: center; padding-left: 28px;
            font: 700 38px/1 "Rubik", sans-serif; color: #0a0d14; }
          .ln { position: absolute; left: 0; width: 944px; text-align: center; font-family: "Lilita One", sans-serif; font-size: 114px; line-height: 1; color: #0a0d14; white-space: nowrap; }
          .ln b { font-weight: 400; color: #1f6fd6; }
          #s7-l1 { top: 182px; }
          #s7-l2 { top: 368px; }
        </style>
        <div id="s7-win">
          <div id="s7-bar"><span class="dot" style="left:34px"></span><span class="dot" style="left:80px"></span><span class="dot" style="left:126px"></span>
            <div id="s7-url" data-var-text="site">stalak.app</div></div>
          <div class="ln" id="s7-l1"><b>NO</b> DOWNLOAD.</div>
          <div class="ln" id="s7-l2"><b>NO</b> SIGN-UP.</div>
        </div>
        <script>
          (function () {
            var F = 1 / 30;
            var tl = gsap.timeline({ paused: true });
            tl.fromTo("#s7-win", { y: 1000, rotation: -5, rotationX: 62, scale: 0.92, transformPerspective: 1800 }, { y: 0, rotation: 0, rotationX: 0, scale: 1, transformPerspective: 1800, duration: 0.4, ease: "expo.out" }, 0);
            // the window keeps turning gently toward us until it faces the camera for the zoom-through
            tl.fromTo("#s7-win", { rotationY: -7 }, { rotationY: 0, duration: 2.4, ease: "sine.inOut", immediateRender: false }, 0.4);
            [["#s7-l1", 0.08], ["#s7-l2", 1.61]].forEach(function (l) {
              tl.fromTo(l[0], { scale: 1.6, rotationX: -75, opacity: 0, filter: "blur(10px)", transformPerspective: 900 }, { scale: 1, rotationX: 0, opacity: 1, filter: "blur(0px)", transformPerspective: 900, duration: 0.2, ease: "expo.out" }, l[1]);
              tl.set("#s7-win", { x: 10 }, l[1] + 0.18); tl.set("#s7-win", { x: -8 }, l[1] + 0.18 + F); tl.set("#s7-win", { x: 0 }, l[1] + 0.18 + 2 * F);
            });
            // zoom through the window: its white becomes the next frame
            tl.to("#s7-win", { scale: 5.2, duration: 0.3, ease: "power3.in" }, 2.82);
            tl.to("#s7-l1, #s7-l2, #s7-bar", { opacity: 0, duration: 0.14, ease: "power2.in" }, 2.82);
            window.__timelines["s7"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
