        <script>
          (function () {
            var HIT = 1.382;                       // the song's first big hit (kick after the gap)
            var F = 1 / 30;
            var tl = gsap.timeline({ paused: true });
            // 1. the crack: already a sliver at frame 0 (the thumbnail), grows faster and faster until the hit
            tl.fromTo("#s1-crack .c-a, #s1-crack .c-b", { strokeDashoffset: 0.82 }, { strokeDashoffset: 0, duration: HIT - 0.05, ease: "power2.in" }, 0);
            tl.fromTo("#s1-crack .c-g, #s1-crack .c-h", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.55, ease: "power2.in" }, 0.25);
            tl.fromTo("#s1-crack .c-c, #s1-crack .c-d", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.45, ease: "power3.in" }, 0.72);
            tl.fromTo("#s1-crack .c-e, #s1-crack .c-f", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.42, ease: "power3.in" }, 0.9);
            // a nervous tremor in the near-silence just before the hit (seek-safe: fixed steps)
            [0, 1, 2, 3, 4, 5].forEach(function (k) { tl.set("#s1-crack-g", { x: [3, -3, 2, -2, 1, 0][k], y: [-2, 2, -1, 1, 0, 0][k] }, 1.05 + k * 2 * F); });
            // 2. the hit: the crack turns white, the ice floods blue, one white frame
            tl.set("#s1-crack .o", { stroke: "#ffffff" }, HIT);
            tl.set("#s1-flood", { opacity: 1 }, HIT);
            tl.fromTo("#s1-flash", { opacity: 0.9 }, { opacity: 0, duration: 0.2, ease: "power2.out", immediateRender: false }, HIT);
            tl.to("#s1-crack", { opacity: 0, duration: 0.22, ease: "power2.out" }, HIT + 0.04);
            // the sheet bursts into ice plates that fly at the camera, catching blue light on their edges
            function h(i, k) { var v = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return v - Math.floor(v); }
            var tints = ["#0f1a33", "#13254a", "#0b1426", "#183064", "#10203f"];
            document.querySelectorAll("#s1-sheet .sh").forEach(function (el, i) {
              var c = el.getAttribute("data-c").split(","), cx = +c[0] - 540, cy = +c[1] - 960;
              var d = Math.sqrt(cx * cx + cy * cy) || 1, push = 260 + 0.6 * d;
              var poly = el.querySelector("polygon");
              tl.set(poly, { fill: tints[i % tints.length], strokeOpacity: 1 }, HIT);
              tl.to(el, { x: cx / d * push, y: cy / d * push, z: 360 + 300 * h(i, 1),
                rotationX: (h(i, 2) > 0.5 ? 1 : -1) * (50 + 80 * h(i, 3)), rotationY: (h(i, 4) > 0.5 ? 1 : -1) * (40 + 90 * h(i, 5)),
                rotation: (h(i, 6) > 0.5 ? 1 : -1) * (12 + 40 * h(i, 7)), duration: 0.66, ease: "power2.out" }, HIT + (d > 700 ? F : 0));
              tl.to(el, { opacity: 0, duration: 0.3, ease: "power1.in" }, HIT + 0.3);
            });
            // 3. the three takes land on the hit, one frame apart each pair
            var cards = [["#s1-c1", 205, 1010, -6], ["#s1-c2", 540, 990, 2], ["#s1-c3", 875, 1015, 6]];
            cards.forEach(function (c, i) {
              tl.fromTo(c[0], { x: c[1] - 150, y: c[2] - 266 - 40, z: -1200, rotation: c[3] * 3, rotationY: [-62, 34, 66][i], rotationX: 30, opacity: 0, transformPerspective: 1300 },
                { x: c[1] - 150, y: c[2] - 266, z: 0, rotation: c[3], rotationY: 0, rotationX: 0, opacity: 1, transformPerspective: 1300, duration: 0.46, ease: "expo.out" }, HIT + i * 2 * F);
            });
            // landing shake of the whole stage: three frames
            tl.set("#s1-stage", { x: 12, y: -6 }, HIT + F); tl.set("#s1-stage", { x: -9, y: 5 }, HIT + 2 * F); tl.set("#s1-stage", { x: 0, y: 0 }, HIT + 3 * F);
            // a slow camera push while the takes hang there
            tl.fromTo("#s1-stage", { scale: 1 }, { scale: 1.045, duration: 1.4, ease: "sine.inOut", immediateRender: false }, HIT + 0.12);
            // 4. THREE / TAKES. slam on the words of the voice, flipping up out of the screen
            [["#s1-w1", 1.47], ["#s1-w2", 1.83]].forEach(function (w) {
              tl.fromTo(w[0], { scale: 1.8, rotationX: -75, opacity: 0, filter: "blur(12px)", transformPerspective: 900 }, { scale: 1, rotationX: 0, opacity: 1, filter: "blur(0px)", transformPerspective: 900, duration: 0.24, ease: "expo.out" }, w[1]);
              tl.set("#s1-stage", { y: 8 }, w[1] + 0.22); tl.set("#s1-stage", { y: -4 }, w[1] + 0.22 + F); tl.set("#s1-stage", { y: 0 }, w[1] + 0.22 + 2 * F);
            });
            window.__timelines["s1"] = tl;
          })();
