<!doctype html>
<html lang="en">

    <template>

        <style>
          @font-face { font-family: "Lilita One"; src: url("assets/fonts/lilitaone.ttf"); }

          .w .f { position: absolute; left: 0; top: 0; color: #ffffff; clip-path: inset(-20px 100% -30px -20px); }
          /* "effects": ice sparkles burst around the word as it lights up */
          .sp { position: absolute; width: 64px; height: 64px; opacity: 0; }
          .sp path { fill: #ffffff; stroke: #0a0d14; stroke-width: 5; stroke-linejoin: round; }

        <svg class="sp" id="s5-sp2" viewBox="-32 -32 64 64" style="left:804px; top:1030px" aria-hidden="true"><path d="M0-28 L7-7 L28 0 L7 7 L0 28 L-7 7 L-28 0 L-7-7Z" /></svg>
        <svg class="sp" id="s5-sp3" viewBox="-32 -32 64 64" style="left:230px; top:1164px" aria-hidden="true"><path d="M0-28 L7-7 L28 0 L7 7 L0 28 L-7 7 L-28 0 L-7-7Z" /></svg>
        <svg class="sp" id="s5-sp4" viewBox="-32 -32 64 64" style="left:748px; top:1174px" aria-hidden="true"><path d="M0-28 L7-7 L28 0 L7 7 L0 28 L-7 7 L-28 0 L-7-7Z" /></svg>

        <script>
          (function () {
            var tl = gsap.timeline({ paused: true });
            // the three lines arrive together, unlit, just before the voice
            tl.fromTo("#s5-lines .ln", { opacity: 0, y: 40, rotationX: -85, filter: "blur(8px)", transformPerspective: 1000, transformOrigin: "50% 100%" },
              { opacity: 1, y: 0, rotationX: 0, filter: "blur(0px)", transformPerspective: 1000, duration: 0.26, ease: "expo.out", stagger: 0.07 }, 0.18);

              tl.fromTo(k[0] + " .f", { clipPath: "inset(-20px 100% -30px -20px)" }, { clipPath: "inset(-20px -20px -30px -20px)", duration: k[2], ease: "none" }, k[1]);
              tl.fromTo(k[0], { scale: 1 }, { scale: 1.08, duration: 0.08, ease: "power2.out", yoyo: true, repeat: 1 }, k[1]);
            });
            document.querySelectorAll(".sp").forEach(function (el, i) {
              var t = 1.1 + i * 0.045;
              tl.fromTo(el, { scale: 0, rotation: -60, opacity: 1 }, { scale: 1.15, rotation: 30, duration: 0.2, ease: "back.out(2.5)", immediateRender: false }, t);
              tl.to(el, { scale: 0, rotation: 90, opacity: 0, duration: 0.22, ease: "power2.in" }, t + 0.26);
            });
            tl.to("#s5-lines", { opacity: 0, filter: "blur(10px)", duration: 0.14, ease: "power2.in" }, 2.72);
            window.__timelines["s5"] = tl;
          })();
