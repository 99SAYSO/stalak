<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>T-Crazy — une image de la série</title>
<style>@font-face{font-family:'Lilita One';src:url(/site_src/fonts/lilitaone.ttf)}@font-face{font-family:'Rubik';src:url(/site_src/fonts/rubik.ttf);font-weight:300 900}
html,body{margin:0;background:#000}svg{display:block}</style></head><body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="tcrazy.js"></script><script src="decors.js"></script><script src="lights.js"></script><script src="liam.js"></script><script src="cast.js"></script><script src="frame.js"></script><script src="storyboard.js"></script>
<script>
// ?f=bandeau-1-accroche | bandeau-2-narrateur | logo-3 | logo-3-seul … : one frame of the series, 1080 × 1920
const q = new URLSearchParams(location.search);
document.fonts.load('66px "Lilita One"').then(() => document.fonts.load('800 44px Rubik')).then(() => document.fonts.load('700 42px Rubik')).then(() => document.fonts.load('900 48px Rubik')).then(() => {
  const svg = document.getElementById('s');
  svg.innerHTML = FRAME.compose(q.get('f') || 'bandeau-1-accroche');
  // place each character by its feet : data-place="x y h" (feet centre, height in px)
  svg.querySelectorAll('[data-place]').forEach(g => {
    const [x, y, h] = g.getAttribute('data-place').split(' ').map(Number);
    const fig = g.querySelector('.fig') || g.firstElementChild, b = fig.getBBox(), s = h / b.height;
    g.setAttribute('transform', `translate(${(x - (b.x + b.width / 2) * s).toFixed(1)} ${(y - (b.y + b.height) * s).toFixed(1)}) scale(${s.toFixed(4)})`);
  });
  if (window.LIGHTS) LIGHTS.attach(svg); // the glints on what shines, the glow of the screens
  // wait for the real captures and the stickers before the picture is taken
  const imgs = [...svg.querySelectorAll('image')];
  Promise.all(imgs.map(im => new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = im.getAttribute('href'); }))).then(() => setTimeout(() => { window.ready = true; }, 150));
});
</script></body></html>
