<!doctype html><html lang="fr"><head><meta charset="utf-8">
<title>Studio Chambre — moteur</title>
<style>
@font-face{font-family:'Lilita One';src:url(/site_src/fonts/lilitaone.ttf)}
@font-face{font-family:'Rubik';src:url(/site_src/fonts/rubik.ttf);font-weight:300 900}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0e3f8f}
#stage{position:absolute;left:0;top:0}
#ui{position:absolute;inset:0;pointer-events:none;font-family:Rubik,sans-serif}
/* the hook / chapter title : big, white, ink outline, hard shadow (inside the safe zone : under the top 8 %) */
.title{position:absolute;left:540px;width:960px;text-align:center;font:400 88px/1.02 'Lilita One',sans-serif;color:#fdfeff;
  -webkit-text-stroke:11px #0a0d14;paint-order:stroke fill;text-shadow:0 8px 0 #0a0d14;letter-spacing:.5px}
.title.small{font-size:68px}
/* ===== the owner chooses one of 3 looks for the banner, the name labels and the subtitles (?ui=1|2|3) ===== */
/* banner : the episode title, at the top, during the opening shout ; it leaves when the narrator starts */
.bandeau{position:absolute;left:540px;top:178px;width:940px;text-align:center;transform-origin:50% 0}
.bandeau .ep{display:inline-block;font:800 26px/1 Rubik;letter-spacing:5px}
.bandeau .ti{font:400 74px/1.03 'Lilita One';letter-spacing:.5px}
.bandeau.d1 .card{position:relative;background:#fdfeff;border:8px solid #0a0d14;border-radius:30px;box-shadow:0 10px 0 #0a0d14;padding:20px 30px 26px}
.bandeau.d1 .ep{color:#1f6fd6;margin-bottom:10px}
.bandeau.d1 .ti{color:#0a0d14}
.bandeau.d1 svg.ice{position:absolute;left:40px;top:100%;margin-top:4px}
.bandeau.d2{filter:drop-shadow(6px 0 0 #0a0d14) drop-shadow(-6px 0 0 #0a0d14) drop-shadow(0 6px 0 #0a0d14) drop-shadow(0 -6px 0 #0a0d14) drop-shadow(0 10px 0 #0a0d14)}
.bandeau.d2 .ep{background:#0e3f8f;color:#fdfeff;padding:9px 20px 10px;border-radius:999px;margin-bottom:12px}
.bandeau.d2 .slab{clip-path:polygon(2% 14%,16% 0,48% 7%,82% 0,99% 12%,100% 80%,86% 100%,52% 93%,14% 100%,0 72%);
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.8) 31%,rgba(255,255,255,.8) 33%,transparent 34%,transparent 66%,rgba(255,255,255,.65) 67%,rgba(255,255,255,.65) 68.5%,transparent 69.5%),linear-gradient(170deg,#f4faff,#d6ecff 55%,#a9d3ff);padding:36px 64px 42px}
.bandeau.d2 .ti{color:#0a0d14}
.bandeau.d3{width:1260px}
.bandeau.d3 .rib{position:relative;background:#1f6fd6;border-top:9px solid #0a0d14;border-bottom:9px solid #0a0d14;box-shadow:0 12px 0 #0a0d14;padding:18px 170px 24px}
.bandeau.d3 .ep{color:#d6ecff;margin-bottom:8px}
.bandeau.d3 .ti{color:#fdfeff;-webkit-text-stroke:11px #0a0d14;paint-order:stroke fill;text-shadow:0 7px 0 #0a0d14}
/* name label (« YANIS, alias LIL GIVRE ») when the narrator introduces someone */
.label{position:absolute;white-space:nowrap;text-align:center}
.label b{display:block;font:400 56px/1 'Lilita One';font-weight:400}
.label i{display:block;font:italic 800 28px/1.1 Rubik;margin-top:6px}
.label.d1{background:#fdfeff;border:7px solid #0a0d14;border-radius:22px;box-shadow:0 8px 0 #0a0d14;padding:14px 28px 16px;color:#0a0d14}
.label.d1 i{color:#1f6fd6}
.label.d2{filter:drop-shadow(5px 0 0 #0a0d14) drop-shadow(-5px 0 0 #0a0d14) drop-shadow(0 5px 0 #0a0d14) drop-shadow(0 -5px 0 #0a0d14) drop-shadow(0 8px 0 #0a0d14)}
.label.d2 .slab{clip-path:polygon(3% 12%,30% 0,70% 6%,98% 0,100% 82%,88% 100%,40% 94%,0 100%);background:linear-gradient(170deg,#f4faff,#d6ecff 60%,#a9d3ff);padding:18px 34px 22px;color:#0a0d14}
.label.d2 i{color:#0e3f8f}
.label.d3{background:#1f6fd6;border:7px solid #0a0d14;box-shadow:0 8px 0 #0a0d14;padding:12px 30px 16px;color:#fdfeff}
.label.d3 b{-webkit-text-stroke:9px #0a0d14;paint-order:stroke fill}
.label.d3 i{color:#d6ecff}
/* subtitles : 2 to 5 words, the name of who speaks, above the bottom 20 % and left of the right-side buttons */
.sub{position:absolute;left:510px;top:1214px;max-width:860px;width:max-content;text-align:center;transform-origin:50% 50%}
.sub .tx{display:block;text-wrap:balance}
.bandeau .ti{text-wrap:balance}
.sub.d1{background:#fdfeff;border:7px solid #0a0d14;border-radius:26px;box-shadow:0 9px 0 #0a0d14;padding:32px 36px 20px;font:800 52px/1.12 Rubik;color:#0a0d14}
.sub.d1 .who{position:absolute;left:-18px;top:-34px;transform:rotate(-4deg);font:400 32px/1 'Lilita One';padding:9px 20px 11px;border:5px solid #0a0d14;border-radius:999px;box-shadow:0 5px 0 #0a0d14;color:#fdfeff;background:var(--c);white-space:nowrap}
.sub.d2{font:800 58px/1.12 Rubik;color:#fdfeff;-webkit-text-stroke:12px #0a0d14;paint-order:stroke fill;text-shadow:0 6px 0 #0a0d14;padding-top:64px}
.sub.d2 .whow{position:absolute;left:50%;top:0;transform:translateX(-50%) rotate(-3deg);filter:drop-shadow(4px 0 0 #0a0d14) drop-shadow(-4px 0 0 #0a0d14) drop-shadow(0 4px 0 #0a0d14) drop-shadow(0 -4px 0 #0a0d14)}
.sub.d2 .who{display:block;clip-path:polygon(4% 10%,30% 0,70% 6%,97% 0,100% 70%,92% 100%,40% 92%,0 100%);background:var(--c);font:400 32px/1 'Lilita One';-webkit-text-stroke:0;text-shadow:none;color:#fdfeff;padding:10px 26px 13px;white-space:nowrap}
.sub.d3{background:#0e3f8f;border:6px solid #0a0d14;border-radius:30px;box-shadow:0 8px 0 #0a0d14;padding:16px 32px 22px;font:700 50px/1.14 Rubik;color:#fdfeff;text-align:left}
.sub.d3 .who{display:block;font:400 34px/1.1 'Lilita One';color:var(--c3);margin-bottom:4px;letter-spacing:1px}
.sub.d3::after{content:"";position:absolute;left:70px;bottom:-24px;width:36px;height:36px;background:#0e3f8f;border-right:6px solid #0a0d14;border-bottom:6px solid #0a0d14;transform:rotate(45deg)}
.sub .who.dark{color:#0a0d14}
.stamp{position:absolute;padding:10px 30px 14px;background:#fdfeff;border:8px solid #0a0d14;border-radius:22px;box-shadow:0 10px 0 #0a0d14;
  font:400 82px/1 'Lilita One',sans-serif;color:#0a0d14;white-space:nowrap}
.stamp.red{background:#e5484d;color:#fdfeff}
.stamp.clock{background:#0b1b3d;color:#e5484d;font-family:Rubik;font-weight:800;letter-spacing:4px}
.steps{position:absolute;left:70px;width:860px}
.step{display:flex;align-items:center;gap:20px;margin:0 0 18px;padding:12px 26px 14px 14px;background:#fdfeff;border:7px solid #0a0d14;border-radius:24px;
  box-shadow:0 8px 0 #0a0d14;font:400 50px/1.05 'Lilita One',sans-serif;color:#0a0d14;width:max-content;max-width:860px}
.step b{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:#1f6fd6;color:#fdfeff;border:6px solid #0a0d14;font:400 40px 'Lilita One';flex:none}
.wm{position:absolute;left:44px;top:176px;width:132px;opacity:.85}
.flash{position:absolute;inset:0;background:#fdfeff}
.endurl{position:absolute;left:540px;transform:translateX(-50%);font:400 120px/1 'Lilita One';color:#fdfeff;-webkit-text-stroke:14px #0a0d14;paint-order:stroke fill;text-shadow:0 10px 0 #0a0d14;white-space:nowrap}
.endsub{position:absolute;left:540px;transform:translateX(-50%);font:700 46px/1.2 Rubik;color:#0a0d14;background:#fdfeff;border:7px solid #0a0d14;border-radius:999px;padding:10px 34px 14px;box-shadow:0 8px 0 #0a0d14;white-space:nowrap}
.tease{position:absolute;left:540px;transform:translateX(-50%);width:820px;text-align:center;font:400 54px/1.1 'Lilita One';color:#0a0d14;background:#d6ecff;border:8px solid #0a0d14;border-radius:28px;padding:20px 26px 24px;box-shadow:0 10px 0 #0a0d14}
.tease small{display:block;font:800 30px/1.2 Rubik;color:#1f6fd6;letter-spacing:3px;margin-bottom:8px}
.serie{position:absolute;left:540px;transform:translateX(-50%);font:800 34px Rubik;letter-spacing:6px;color:#fdfeff;-webkit-text-stroke:8px #0a0d14;paint-order:stroke fill;white-space:nowrap}
.karaoke{position:absolute;left:520px;transform:translateX(-50%);width:860px;text-align:center;font:italic 800 54px/1.15 Rubik;color:#8fd3ff;-webkit-text-stroke:10px #0a0d14;paint-order:stroke fill}
.karaoke span.on{color:#fdfeff}
</style></head><body>
<svg id="stage" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="ui"></div>
<script src="perso.js"></script>
<script src="decor.js"></script>
<script src="play.js"></script>
<script>
const q = new URLSearchParams(location.search);
const load = (src) => new Promise(r => { const s = document.createElement('script'); s.src = src; s.onload = r; document.body.appendChild(s); });
load('../episodes/common.js').then(() => load('../episodes/' + q.get('ep') + '.js')).then(() => boot());
</script>
</body></html>
