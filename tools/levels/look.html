<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Lilita;src:url(../../public/fonts/lilitaone.ttf)}
@font-face{font-family:Rubik;src:url(../../public/fonts/rubik.ttf)}
html,body{margin:0;background:#000}
svg{display:block}
</style></head><body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"><g id="bg"></g><g id="dyn"></g></svg>
<script src="engine.js"></script>
<script>
// Le nouveau look de LEVELS (17/11) : contours épais, haut d'écran sur fond uni, titre tout blanc, jauge HYPE
// avec son commentaire sarcastique, lumière ambiante. ?scene=frame1|frame1hit|jauges|perso
const Q = new URLSearchParams(location.search), SC = Q.get('scene') || 'frame1';
const OL = '#0d1020', LW = 13; // contour épais
document.getElementById('bg').innerHTML = decorSVG().split('<rect width="1080" height="1920" fill="#0d1328"/>')[0]; // garde seulement les <defs>
let o = '';
const add = s => o += s;

// ---------- le haut de l'écran : fond uni, titre blanc
function topBar(lines, lvl, label, ok, hype, comment, opts = {}) {
  add(`<rect x="0" y="0" width="1080" height="${opts.h || 730}" fill="#0b0e1a"/>`);
  lines.forEach((l, i) => add(`<text x="540" y="${170 + i * 74}" font-family="Lilita" font-size="66" fill="#fff" text-anchor="middle">${l}</text>`));
  const y0 = 170 + lines.length * 74 - 20;
  for (let i = 1; i <= 5; i++) {
    const st = i < lvl ? 'ko' : i === lvl ? (ok ? 'ok' : 'cur') : '';
    const col = st === 'ko' ? '#e5484d' : st === 'ok' ? '#2fb36b' : st === 'cur' ? '#ffffff' : 'none';
    const x = 540 + (i - 3) * 96 - 38;
    add(`<rect x="${x}" y="${y0}" width="76" height="76" rx="16" fill="${col}" stroke="#fff" stroke-width="5"/>
      <text x="${x + 38}" y="${y0 + 55}" font-family="Lilita" font-size="48" text-anchor="middle" fill="${st === 'cur' ? '#0b0e1a' : '#fff'}">${i}</text>`);
  }
  add(`<text x="540" y="${y0 + 130}" font-family="Rubik" font-weight="700" font-size="40" text-anchor="middle" fill="${ok ? '#4fd88a' : '#ff6b70'}">${ok ? '✓' : '✗'} ${label}</text>`);
  gauge(150, y0 + 220, 780, hype, comment, opts.gauge || {});
}
// ---------- la jauge HYPE
function gauge(x, y, w, v, comment, g) {
  const col = v >= 1 ? '#ffc93c' : v > 0.5 ? '#2fb36b' : v > 0.2 ? '#ff9f43' : '#e5484d';
  let s = `<g transform="translate(${x},${y}) rotate(${g.rot || 0} ${w / 2} 30)">`;
  if (g.glow) s += `<rect x="-30" y="-30" width="${w + 60}" height="120" rx="60" fill="#ffc93c" opacity=".35" filter="url(#blur8)"/>`;
  s += `<text x="0" y="-14" font-family="Lilita" font-size="40" fill="#fff">HYPE</text>
    <text x="${w}" y="-14" font-family="Lilita" font-size="40" fill="${col}" text-anchor="end">${Math.round(v * 100)} %</text>
    <rect x="0" y="0" width="${w}" height="56" rx="28" fill="#1a1f33" stroke="#fff" stroke-width="5"/>
    <rect x="8" y="8" width="${Math.max(40, (w - 16) * v)}" height="40" rx="20" fill="${col}"/>
    <rect x="16" y="12" width="${Math.max(20, (w - 32) * v)}" height="10" rx="5" fill="#fff" opacity=".35"/>`;
  if (g.cracks) s += `<path d="M${w * 0.3} 0 l 14 22 l -10 14 l 16 20 M${w * 0.7} 56 l -12 -20 l 12 -12 l -8 -24" stroke="#fff" stroke-width="4" fill="none"/>`;
  if (g.burst) { for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8, r1 = 70, r2 = 140 + (i % 3) * 30; s += `<line x1="${w + Math.cos(a) * r1 - 30}" y1="${28 + Math.sin(a) * r1}" x2="${w + Math.cos(a) * r2 - 30}" y2="${28 + Math.sin(a) * r2}" stroke="${['#ffc93c', '#ff6b70', '#7fd3ff', '#fff'][i % 4]}" stroke-width="10" stroke-linecap="round"/>`; } }
  s += `<text x="${w / 2}" y="${104}" font-family="Rubik" font-weight="700" font-size="34" fill="#c9d2f0" text-anchor="middle">${comment}</text></g>`;
  add(s);
}
// ---------- la rue (contours épais, lumière ambiante)
function rue() {
  add(`<rect x="0" y="700" width="1080" height="1220" fill="#151b38"/>`);
  // façades
  const F = [[-30, 760, 330, '#2a2f55'], [300, 820, 300, '#33295a'], [600, 740, 520, '#26345e']];
  for (const [x, y, w, c] of F) {
    add(`<rect x="${x}" y="${y}" width="${w}" height="${1480 - y}" fill="${c}" stroke="${OL}" stroke-width="${LW}"/>`);
    for (let yy = y + 50; yy < 1380; yy += 150) for (let xx = x + 40; xx < x + w - 80; xx += 110) {
      const on = ((xx * 3 + yy) % 7) < 3;
      add(`<rect x="${xx}" y="${yy}" width="70" height="90" rx="6" fill="${on ? '#ffd27a' : '#1c2246'}" stroke="${OL}" stroke-width="9"/>`);
      if (on) add(`<rect x="${xx - 30}" y="${yy - 30}" width="130" height="150" rx="40" fill="#ffc96b" opacity=".18" filter="url(#blur8)"/>`);
    }
  }
  // vitrine d'une épicerie
  add(`<rect x="660" y="1180" width="380" height="300" fill="#1c2246" stroke="${OL}" stroke-width="${LW}"/><rect x="640" y="1130" width="420" height="70" rx="10" fill="#c43b4a" stroke="${OL}" stroke-width="${LW}"/>
   ${[0, 1, 2, 3, 4, 5].map(k => `<path d="M${640 + k * 70} 1200 q 35 40 70 0" fill="${k % 2 ? '#fff' : '#c43b4a'}" stroke="${OL}" stroke-width="8"/>`).join('')}
   <rect x="690" y="1240" width="320" height="200" fill="#ffe8b0" opacity=".85" stroke="${OL}" stroke-width="9"/>`);
  // trottoir et route
  add(`<rect x="0" y="1480" width="1080" height="440" fill="#262c4d" stroke="${OL}" stroke-width="${LW}"/><rect x="0" y="1480" width="1080" height="34" fill="#3a4170" stroke="${OL}" stroke-width="${LW}"/>`);
  // lampadaire + halo (lumière ambiante)
  add(`<circle cx="200" cy="900" r="420" fill="url(#halo)" opacity=".55"/><ellipse cx="200" cy="1500" rx="320" ry="60" fill="#ffd27a" opacity=".22"/>
   <rect x="232" y="900" width="20" height="600" fill="#3a4170" stroke="${OL}" stroke-width="10"/><path d="M242 905 q -10 -50 -70 -40" stroke="#3a4170" stroke-width="20" fill="none"/><path d="M242 905 q -10 -50 -70 -40" stroke="${OL}" stroke-width="30" fill="none" opacity=".0"/>
   <ellipse cx="172" cy="875" rx="44" ry="20" fill="#fff6d8" stroke="${OL}" stroke-width="8"/>`);
  // lumière ambiante bleutée + vignette
  add(`<rect x="0" y="700" width="1080" height="1220" fill="#3b6dff" opacity=".07"/><rect x="0" y="700" width="1080" height="1220" fill="url(#vig)"/>`);
}
function bub(x, y, w, text, tail) { add(bubble(x, y, w, text, tail, 1, { fs: 40 })); }

if (SC === 'frame1' || SC === 'frame1hit') {
  rue();
  const hit = SC === 'frame1hit';
  // le passant
  add(stick({ x: 790, y: 1560, h: 560, color: '#ffb36b', lw: LW, flip: true, pose: hit ? { la: [175, 185], ra: [40, 80], ll: [100, 105], rl: [80, 75] } : { la: [120, 100], ra: [60, 80], ll: [100, 105], rl: [80, 75] } }));
  // casquette du passant
  add(`<path d="M${790 - 70} ${1560 - 560 * 0.66 - 560 * 0.17 * 1.7} q 70 -60 140 0 z" fill="#2fb36b" stroke="${OL}" stroke-width="${LW}"/>`);
  if (!hit) {
    add(stick({ x: 420, y: 1560, h: 560, color: '#f7f8fc', hat: true, lw: LW, pose: { la: [110, 95], ra: [-20, -15], ll: [100, 108], rl: [80, 72] } }));
    add(`<path d="M520 1110 q 140 -60 210 -30" stroke="#fff" stroke-width="7" fill="none"/><circle cx="728" cy="1080" r="14" fill="#fff" stroke="${OL}" stroke-width="6"/>`); // l'écouteur tendu
    bub(40, 980, 760, 'Frérot, deux secondes : écoute mon son, c\'est le prochain Pop Smoke.', 420);
    topBar(['COMMENT FAIRE LA PROMO', 'DE TON SON QUAND', 'T\'AS 0 ABONNÉ'], 1, 'personne ne t\'a demandé', false, 0.02, 'même toi t\'y crois pas');
  } else {
    add(stick({ x: 330, y: 1560, h: 560, color: '#f7f8fc', hat: true, lw: LW, rot: -24, pose: { la: [230, 260], ra: [-40, -80], ll: [115, 130], rl: [60, 30] } }));
    add(stars(250, 970, 0.3));
    add(boom(560, 1080, 'BAF !', -8, 1));
    bub(430, 980, 520, 'Je t\'ai rien demandé.', 790);
    topBar(['COMMENT FAIRE LA PROMO', 'DE TON SON QUAND', 'T\'AS 0 ABONNÉ'], 1, 'personne ne t\'a demandé', false, 0.0, 'même toi t\'y crois pas');
  }
}
if (SC === 'jauges') {
  add(`<rect width="1080" height="1920" fill="#0b0e1a"/>`);
  add(`<text x="540" y="140" font-family="Lilita" font-size="60" fill="#fff" text-anchor="middle">LA JAUGE HYPE</text><text x="540" y="200" font-family="Rubik" font-weight="700" font-size="32" fill="#9aa6cf" text-anchor="middle">toujours au même endroit, sous les chiffres</text>`);
  const rows = [
    [0.02, 'même toi t\'y crois pas', {}, 'NIVEAU 1 · après la baffe'],
    [0.04, 'Tata Josiane a quitté le groupe', {}, 'NIVEAU 2 · elle remonte un peu, puis retombe'],
    [0.01, '12 vues, dont 3 c\'est ta mère', { rot: 10, cracks: true }, 'NIVEAU 4 · elle se décroche et lui tombe dessus'],
    [1.0, 'là, ça donne envie', { glow: true, burst: true }, 'NIVEAU 5 · elle explose'],
  ];
  rows.forEach(([v, c, g, lab], i) => {
    const y = 380 + i * 400 + (i === 2 ? 60 : 0);
    add(`<text x="80" y="${y - (i === 2 ? 150 : 90)}" font-family="Lilita" font-size="38" fill="#ffc93c">${lab}</text>`);
    gauge(150, y, 780, v, c, g);
  });
}
if (SC === 'perso') {
  add(`<rect width="1080" height="1920" fill="#151b38"/><circle cx="540" cy="900" r="700" fill="url(#halo)" opacity=".25"/>`);
  add(`<text x="540" y="140" font-family="Lilita" font-size="60" fill="#fff" text-anchor="middle">LES PERSONNAGES</text><text x="540" y="200" font-family="Rubik" font-weight="700" font-size="32" fill="#9aa6cf" text-anchor="middle">contours épais, comme ta vidéo d'exemple</text>`);
  add(stick({ x: 190, y: 880, h: 500, color: '#f7f8fc', hat: true, lw: LW }));
  add(stick({ x: 520, y: 880, h: 500, color: '#f7f8fc', hat: true, lw: LW, pose: { la: [200, 235], ra: [-20, -60], ll: [100, 108], rl: [80, 72] } }));
  add(stick({ x: 900, y: 880, h: 500, color: '#f7f8fc', hat: true, lw: LW, rot: -20, pose: { la: [230, 260], ra: [-40, -80], ll: [115, 130], rl: [60, 30] } }));
  add(stars(850, 330, 0.5));
  [['LE RAPPEUR', 190], ['IL FAIT SA PROMO', 520], ['IL SE PREND LE COUP', 880]].forEach(([t, x]) => add(`<text x="${x}" y="1050" font-family="Lilita" font-size="38" fill="#fff" text-anchor="middle">${t}</text>`));
  add(stick({ x: 200, y: 1650, h: 480, color: '#ffb36b', lw: LW }));
  add(`<path d="M${200 - 66} ${1650 - 480 * 0.66 - 480 * 0.17 * 1.7} q 66 -56 132 0 z" fill="#2fb36b" stroke="${OL}" stroke-width="${LW}"/>`);
  add(stick({ x: 540, y: 1650, h: 480, color: '#d7a6e8', lw: LW, pose: { la: [110, 95], ra: [-30, -50], ll: [100, 105], rl: [80, 75] }, phone: true }));
  add(`<circle cx="540" cy="${1650 - 480 * 0.66 - 480 * 0.17 * 1.9}" r="42" fill="#d7a6e8" stroke="${OL}" stroke-width="${LW}"/>`);
  add(stick({ x: 880, y: 1650, h: 480, color: '#9fe0c0', lw: LW }));
  add(`<circle cx="880" cy="${1650 - 480 * 0.66 - 480 * 0.17 * 1.95}" r="38" fill="#9fe0c0" stroke="${OL}" stroke-width="${LW}"/><circle cx="880" cy="${1650 - 480 * 0.66 - 480 * 0.17 * 2.3}" r="25" fill="#9fe0c0" stroke="${OL}" stroke-width="${LW}"/>`);
  [['L\'INCONNU', 200], ['SA MÈRE', 540], ['TATA JOSIANE', 880]].forEach(([t, x]) => add(`<text x="${x}" y="1815" font-family="Lilita" font-size="38" fill="#fff" text-anchor="middle">${t}</text>`));
}
document.getElementById('dyn').innerHTML = o;
</script>
</body></html>
