<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Lilita;src:url(../../public/fonts/lilitaone.ttf)}
@font-face{font-family:Rubik;src:url(../../public/fonts/rubik.ttf)}
html,body{margin:0;background:#000}
svg{display:block}
</style></head><body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
// Planches de style LEVELS (images fixes). ?style=glace|nuit|sticker&scene=n1|n5
const P=new URLSearchParams(location.search);
const STYLE=P.get('style')||'glace', SCENE=P.get('scene')||'n1';
const INK='#0a0d14', BLUE='#1f6fd6', ICE='#d6ecff', NIGHT='#0e3f8f';
const S=document.getElementById('s');
let out='';
const add=s=>out+=s;

// ---------- palettes par style ----------
const ST={
 glace:{bg:['#bfe2ff','#eaf6ff'], line:INK, lw:9, body:'none', hero:BLUE, target:INK, glow:false, fill:false},
 nuit:{bg:['#050a1c','#11204a'], line:'#ffffff', lw:12, body:'none', hero:'#7cc4ff', target:'#ffffff', glow:true, fill:false},
 sticker:{bg:['#7fc3ff','#d6ecff'], line:INK, lw:7, hero:BLUE, target:'#ffffff', glow:false, fill:true},
 ref:{bg:['#0b1022','#141b33'], line:'#151a2c', lw:6, hero:'#f7f8fc', target:'#b9c3ec', glow:false, fill:false, solid:true}
}[STYLE];

// ---------- décor ----------
function decor(){
 add(`<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${ST.bg[0]}"/><stop offset="1" stop-color="${ST.bg[1]}"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#fff3c4" stop-opacity=".95"/><stop offset=".35" stop-color="#ffd76a" stop-opacity=".35"/><stop offset="1" stop-color="#ffd76a" stop-opacity="0"/></radialGradient>
  <radialGradient id="haloB"><stop offset="0" stop-color="#bfe2ff" stop-opacity=".9"/><stop offset="1" stop-color="#1f6fd6" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="glassG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <radialGradient id="vig" cx=".5" cy=".55" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient>
  <filter id="rim" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="9" result="bl"/><feFlood flood-color="#dfe6ff" flood-opacity=".35" result="fl"/><feComposite in="fl" in2="bl" operator="in" result="gl"/><feMerge><feMergeNode in="gl"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
 </defs>
 <rect width="1080" height="1920" fill="url(#sky)"/>`);
 if(STYLE==='glace'){
  // rue enneigée de jour : immeubles simples au trait, neige
  for(const [x,w,h] of [[-20,260,640],[230,220,820],[440,300,560],[730,370,760]]){
   add(`<rect x="${x}" y="${1500-h}" width="${w}" height="${h}" fill="#ffffff" stroke="${INK}" stroke-width="7"/>`);
   for(let yy=1500-h+50; yy<1440; yy+=110) for(let xx=x+35; xx<x+w-60; xx+=85)
    add(`<rect x="${xx}" y="${yy}" width="46" height="62" fill="${ICE}" stroke="${INK}" stroke-width="5"/>`);
   // neige sur le toit
   add(`<path d="M${x-6} ${1500-h} q ${w/4} -26 ${w/2} 0 q ${w/4} -22 ${w/2+12} 0" fill="#fff" stroke="${INK}" stroke-width="6"/>`);
  }
  add(`<rect x="0" y="1500" width="1080" height="420" fill="#f4fbff" stroke="${INK}" stroke-width="7"/>`);
  add(`<line x1="0" y1="1560" x2="1080" y2="1560" stroke="${INK}" stroke-width="4" stroke-dasharray="40 30" opacity=".35"/>`);
  for(let i=0;i<70;i++){const x=(i*397)%1080,y=(i*733)%1500+380,r=4+(i%4)*2; add(`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="${INK}" stroke-width="2"/>`)}
 } else if(STYLE==='nuit'){
  // rue la nuit, lampadaire avec halo, vitrines qui brillent
  for(const [x,w,h,c] of [[-30,300,700,'#0b1736'],[260,250,880,'#0d1b40'],[500,280,620,'#0b1736'],[770,340,820,'#0d1b40']]){
   add(`<rect x="${x}" y="${1500-h}" width="${w}" height="${h}" fill="${c}"/>`);
   for(let yy=1500-h+60; yy<1420; yy+=120) for(let xx=x+40; xx<x+w-60; xx+=90){
    const on=((xx*7+yy*3)%5)<2;
    add(`<rect x="${xx}" y="${yy}" width="44" height="64" rx="4" fill="${on?'#ffd76a':'#15275a'}" ${on?'filter="url(#glow)"':''}/>`);
   }
  }
  add(`<rect x="0" y="1500" width="1080" height="420" fill="#08112b"/>`);
  // lampadaire
  add(`<circle cx="905" cy="900" r="330" fill="url(#halo)"/><ellipse cx="905" cy="1520" rx="260" ry="40" fill="#ffd76a" opacity=".18"/>
  <line x1="960" y1="905" x2="960" y2="1510" stroke="#2a3b6b" stroke-width="16"/><path d="M960 905 q -10 -40 -55 -30" stroke="#2a3b6b" stroke-width="14" fill="none"/>
  <ellipse cx="905" cy="890" rx="30" ry="16" fill="#fff6d8" filter="url(#glow)"/>`);
  for(let i=0;i<40;i++){const x=(i*397)%1080,y=(i*733)%1300+300; add(`<circle cx="${x}" cy="${y}" r="${2+(i%3)}" fill="#cfe6ff" opacity=".7"/>`)}
 } else if(STYLE==='ref'){
  // fond sombre et détaillé : façade de briques + vitrine, arrêt de bus, neige, lampes qui pendent
  add(`<rect width="1080" height="1920" fill="#0d1328"/>`);
  // briques (beaucoup de petites formes de couleurs sourdes, comme une texture dessinée)
  const bc=['#3a2a35','#43303a','#2f2836','#4a3540','#352c3d','#3e2f2f','#2a2533'];
  for(let r=0;r<44;r++){ const y=640+r*26, off=(r%2)*38;
   for(let x=-40;x<1100;x+=76){ const c=bc[(r*7+((x+off)/76|0)*3)%bc.length];
    add(`<rect x="${x+off}" y="${y}" width="72" height="22" rx="3" fill="${c}"/>`);} }
  // vitrine éclairée (une boulangerie fermée), cadre sombre
  add(`<rect x="560" y="760" width="470" height="560" rx="10" fill="#1a2140" stroke="#0a0e1d" stroke-width="16"/>`);
  add(`<rect x="578" y="778" width="434" height="524" fill="#2b3566"/>`);
  for(let i=0;i<3;i++) add(`<rect x="${600+i*140}" y="1150" width="120" height="16" rx="4" fill="#51407a"/><ellipse cx="${640+i*140}" cy="1140" rx="34" ry="14" fill="#8a6a4a"/><ellipse cx="${680+i*140}" cy="1138" rx="26" ry="12" fill="#a07a55"/>`);
  add(`<rect x="578" y="778" width="434" height="524" fill="url(#glassG)"/>`);
  // abri de bus : poteaux + toit + panneau
  add(`<rect x="40" y="820" width="20" height="700" fill="#232a47"/><rect x="500" y="820" width="20" height="700" fill="#232a47"/>
  <rect x="20" y="800" width="520" height="40" rx="8" fill="#2c3457"/>
  <rect x="70" y="860" width="150" height="210" rx="6" fill="#1b2140" stroke="#3a4473" stroke-width="5"/>
  <text x="145" y="925" font-family="Lilita" font-size="44" fill="#ffc93c" text-anchor="middle">BUS</text>
  ${[0,1,2,3].map(i=>`<rect x="92" y="${950+i*26}" width="106" height="12" rx="5" fill="#3a4473"/>`).join('')}`);
  // trottoir
  add(`<rect x="0" y="1500" width="1080" height="420" fill="#141a30"/><rect x="0" y="1500" width="1080" height="18" fill="#232b4a"/>`);
  for(let x=0;x<1080;x+=160) add(`<line x1="${x}" y1="1518" x2="${x-60}" y2="1920" stroke="#1b2240" stroke-width="5"/>`);
  // lampes qui pendent avec halo (comme une lumière douce venue d'en haut)
  for(const x of [210,870]) add(`<circle cx="${x}" cy="660" r="260" fill="url(#halo)" opacity=".45"/><line x1="${x}" y1="0" x2="${x}" y2="640" stroke="#0a0e1d" stroke-width="6"/>
   <path d="M${x-60} 680 L${x-30} 630 L${x+30} 630 L${x+60} 680 Z" fill="#1b2140"/><ellipse cx="${x}" cy="682" rx="44" ry="10" fill="#fff1c2"/>`);
  // neige douce
  for(let i=0;i<60;i++){const x=(i*397)%1080,y=(i*733)%1250+640; add(`<circle cx="${x}" cy="${y}" r="${2+(i%3)}" fill="#dfe8ff" opacity=".55"/>`)}
  // vignette
  add(`<rect width="1080" height="1920" fill="url(#vig)"/>`);
 } else {
  // sticker : terrain de basket, aplats + glaçons en haut
  add(`<rect x="0" y="1180" width="1080" height="740" fill="#e9874a" stroke="${INK}" stroke-width="8"/>
  <path d="M-10 1180 L 1090 1180" stroke="${INK}" stroke-width="8"/>
  <ellipse cx="540" cy="1650" rx="260" ry="90" fill="none" stroke="#fff" stroke-width="10"/>
  <line x1="0" y1="1650" x2="1080" y2="1650" stroke="#fff" stroke-width="10"/>`);
  // grillage
  for(let x=-200;x<1300;x+=60){add(`<line x1="${x}" y1="760" x2="${x+420}" y2="1180" stroke="${INK}" stroke-width="3" opacity=".35"/><line x1="${x+420}" y1="760" x2="${x}" y2="1180" stroke="${INK}" stroke-width="3" opacity=".35"/>`)}
  add(`<rect x="0" y="752" width="1080" height="16" fill="#9aa7b8" stroke="${INK}" stroke-width="5"/>`);
  // panier
  add(`<rect x="850" y="560" width="190" height="130" fill="#fff" stroke="${INK}" stroke-width="8"/><rect x="900" y="610" width="90" height="60" fill="none" stroke="#e44" stroke-width="7"/>
  <line x1="1030" y1="690" x2="1030" y2="1190" stroke="${INK}" stroke-width="16"/><ellipse cx="945" cy="700" rx="55" ry="12" fill="none" stroke="#e44" stroke-width="8"/>`);
  // nuages sticker
  for(const [x,y,s] of [[170,690,.8],[620,650,.7]]) add(`<g transform="translate(${x+8},${y+8}) scale(${s})" fill="${INK}"><ellipse rx="110" ry="50"/><ellipse cx="70" cy="-30" rx="70" ry="50"/></g><g transform="translate(${x},${y}) scale(${s})" fill="#fff" stroke="${INK}" stroke-width="7"><ellipse rx="110" ry="50"/><ellipse cx="70" cy="-30" rx="70" ry="50"/></g>`);
 }
}

// ---------- bonhomme ----------
// pose : angles des membres. o = {x,y(pieds),h, rot, pose, color, cap, hood, eyes}
function stick(o){
 const c=o.color, lw=ST.lw*(o.scale||1), h=o.h||520;
 const head=h*0.17, neckY=-h*0.66, hipY=-h*0.30;
 const P={...{la:[200,230],ra:[-20,20],ll:[100,110],rl:[80,70]}, ...o.pose};
 const L=(a,len)=>[Math.cos(a*Math.PI/180)*len, Math.sin(a*Math.PI/180)*len];
 const arm=h*0.20, leg=h*0.25;
 const limb=(sx,sy,[a1,a2],len)=>{const [x1,y1]=L(a1,len),[x2,y2]=L(a2,len); return `M${sx} ${sy} l${x1} ${y1} l${x2} ${y2}`};
 const sh=neckY+h*0.05;
 let d=[`M0 ${neckY} L0 ${hipY}`, limb(0,sh,P.la,arm), limb(0,sh,P.ra,arm), limb(0,hipY,P.ll,leg), limb(0,hipY,P.rl,leg)].join(' ');
 let g=`<g transform="translate(${o.x},${o.y}) rotate(${o.rot||0}) scale(${o.flip?-1:1},1)">`;
 if(ST.solid){
  const limbW=h*0.078, torsoW=h*0.15, ol=ST.line;
  const td=`M0 ${neckY+torsoW*0.35} L0 ${hipY}`;
  const limbs=[limb(-torsoW*0.32,sh,P.la,arm), limb(torsoW*0.32,sh,P.ra,arm), limb(-limbW*0.55,hipY,P.ll,leg), limb(limbW*0.55,hipY,P.rl,leg)].join(' ');
  g+=`<g filter="url(#rim)">`;
  g+=`<path d="${limbs}" stroke="${ol}" stroke-width="${limbW+lw*2}" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
  g+=`<path d="${td}" stroke="${ol}" stroke-width="${torsoW+lw*2}" stroke-linecap="round" fill="none"/>`;
  g+=`<path d="${limbs}" stroke="${c}" stroke-width="${limbW}" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
  g+=`<path d="${td}" stroke="${c}" stroke-width="${torsoW}" stroke-linecap="round" fill="none"/>`;
  g+=`<circle cx="0" cy="${neckY-head*0.9}" r="${head}" fill="${c}" stroke="${ol}" stroke-width="${lw}"/>`;
  g+=`</g>`;
 } else if(ST.fill){
  // style sticker : membres épais remplis + ombre dure
  g+=`<path d="${d}" transform="translate(10,10)" stroke="${INK}" stroke-width="${lw*5}" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
  g+=`<path d="${d}" stroke="${INK}" stroke-width="${lw*5}" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
  g+=`<path d="${d}" stroke="${c}" stroke-width="${lw*5-lw*2}" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
  g+=`<circle cx="10" cy="${neckY-head+10}" r="${head}" fill="${INK}"/><circle cx="0" cy="${neckY-head}" r="${head}" fill="${c}" stroke="${INK}" stroke-width="${lw}"/>`;
 } else {
  const f=ST.glow?'filter="url(#glow)"':'';
  g+=`<path d="${d}" stroke="${c}" stroke-width="${lw}" stroke-linecap="round" stroke-linejoin="round" fill="none" ${f}/>`;
  g+=`<circle cx="0" cy="${neckY-head}" r="${head}" fill="${ST.glow?'#0b1736':'#fff'}" stroke="${c}" stroke-width="${lw}" ${f}/>`;
 }
 const hy=ST.solid?neckY-head*0.9:neckY-head;
 // yeux
 if(ST.solid && o.eyes!=='spiral' && !o.face){ /* comme la référence : pas de visage */ }
 else if(o.eyes==='spiral'){
  for(const ex of [-head*.38, head*.38]) g+=`<path d="M${ex} ${hy-4} m-10 0 a10 10 0 1 1 10 10 a6 6 0 1 1 -6 -6" fill="none" stroke="${ST.glow?'#fff':INK}" stroke-width="4"/>`;
 } else if(o.eyes!=='none'){
  const ec=ST.glow?'#fff':(ST.solid?'#151a2c':INK);
  for(const ex of [-head*.36, head*.36]) g+=`<ellipse cx="${ex+(o.look||0)}" cy="${hy-6}" rx="${head*.1}" ry="${head*.16}" fill="${ec}"/>`;
  if(o.mouth) g+=`<path d="${o.mouth==='smile'?`M${-head*.35} ${hy+head*.35} q ${head*.35} ${head*.3} ${head*.7} 0`:`M${-head*.3} ${hy+head*.45} q ${head*.3} ${-head*.25} ${head*.6} 0`}" stroke="${ec}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
 }
 // signe distinctif du rappeur : bonnet bleu à pompon + écharpe
 if(o.hat){
  const hc=BLUE, ol=ST.glow?'#bfe2ff':(ST.solid?ST.line:INK);
  g+=`<path d="M${-head*1.02} ${hy-head*0.15} Q ${-head} ${hy-head*1.35} 0 ${hy-head*1.3} Q ${head} ${hy-head*1.35} ${head*1.02} ${hy-head*0.15} Z" fill="${hc}" stroke="${ol}" stroke-width="6" ${ST.glow?'filter="url(#glow)"':''}/>`;
  g+=`<rect x="${-head*1.1}" y="${hy-head*0.4}" width="${head*2.2}" height="${head*0.38}" rx="10" fill="${ICE}" stroke="${ol}" stroke-width="6"/>`;
  g+=`<circle cx="0" cy="${hy-head*1.42}" r="${head*0.26}" fill="${ICE}" stroke="${ol}" stroke-width="6"/>`;
  g+=`<path d="M${-head*0.7} ${neckY+8} q ${head*0.7} ${head*0.35} ${head*1.4} 0 l -10 ${head*0.9} l -22 -6 l 6 -${head*0.6}" fill="${hc}" stroke="${ol}" stroke-width="6" stroke-linejoin="round"/>`;
 }
 if(o.phone){
  // téléphone dans la main gauche
  const [x1,y1]=L(P.la[0],arm),[x2,y2]=L(P.la[1],arm);
  g+=`<rect x="${x1+x2-22}" y="${sh+y1+y2-38}" width="44" height="76" rx="8" fill="${INK}" stroke="${ST.glow?'#fff':INK}" stroke-width="4"/><rect x="${x1+x2-16}" y="${sh+y1+y2-30}" width="32" height="56" rx="4" fill="#9fd2ff" ${ST.glow?'filter="url(#glow)"':''}/>`;
 }
 g+='</g>';
 add(g);
}

// ---------- HUD Stalak ----------
function hud(genre, lvl, label, ok, hype){
 add(`<g font-family="Lilita" text-anchor="middle">
  <text x="540" y="235" font-size="62" fill="${STYLE==='nuit'?'#fff':INK}" stroke="${STYLE==='nuit'?INK:'#fff'}" stroke-width="10" paint-order="stroke">COMMENT POSTER TON SNIPPET</text>
  <text x="440" y="315" font-size="62" fill="${STYLE==='nuit'?'#fff':INK}" stroke="${STYLE==='nuit'?INK:'#fff'}" stroke-width="10" paint-order="stroke">POUR UN SON</text>
 </g>`);
 const gw=genre.length*38+60;
 add(`<g transform="translate(${640-0},262)"><rect x="8" y="8" width="${gw}" height="74" rx="18" fill="${INK}"/><rect width="${gw}" height="74" rx="18" fill="${BLUE}" stroke="${INK}" stroke-width="6"/>
  <text x="${gw/2}" y="56" font-family="Lilita" font-size="54" fill="#fff" text-anchor="middle">${genre}</text></g>`);
 for(let i=1;i<=5;i++){
  const x=540+(i-3)*92-36, col= i<lvl?'#e5484d': i===lvl?(ok?'#2fb36b':'#e5484d'):'#ffffff';
  add(`<rect x="${x+6}" y="${375+6}" width="72" height="72" rx="14" fill="${INK}"/><rect x="${x}" y="375" width="72" height="72" rx="14" fill="${col}" stroke="${INK}" stroke-width="6"/>
  <text x="${x+36}" y="427" font-family="Lilita" font-size="46" text-anchor="middle" fill="${i<=lvl?'#fff':INK}">${i}</text>`);
 }
 const lw=label.length*21+110;
 add(`<g transform="translate(${540-lw/2},475)"><rect x="6" y="6" width="${lw}" height="66" rx="33" fill="${INK}"/><rect width="${lw}" height="66" rx="33" fill="#fff" stroke="${INK}" stroke-width="5"/>
  <text x="44" y="46" font-family="Rubik" font-weight="700" font-size="40" fill="${ok?'#2fb36b':'#e5484d'}" text-anchor="middle">${ok?'✓':'✗'}</text>
  <text x="${lw/2+22}" y="45" font-family="Rubik" font-weight="700" font-size="36" fill="${INK}" text-anchor="middle">${label}</text></g>`);
 // jauge HYPE
 add(`<g transform="translate(280,575)"><text x="-14" y="34" font-family="Lilita" font-size="34" text-anchor="end" fill="${STYLE==='nuit'?'#fff':INK}" stroke="${STYLE==='nuit'?INK:'#fff'}" stroke-width="6" paint-order="stroke">HYPE</text>
  <rect width="520" height="40" rx="20" fill="#fff" stroke="${INK}" stroke-width="5"/>
  <rect x="5" y="5" width="${Math.max(30,510*hype)}" height="30" rx="15" fill="${hype>=1?'#ffc93c':hype>.5?'#2fb36b':'#e5484d'}"/>
  ${hype>=1?`<text x="540" y="34" font-family="Lilita" font-size="36" fill="#ffc93c" stroke="${INK}" stroke-width="6" paint-order="stroke">MAX</text>`:''}</g>`);
}

function bubble(x,y,w,text,tailX,big){
 const h=big?120:96, fs=big?54:42;
 add(`<g><rect x="${x+8}" y="${y+8}" width="${w}" height="${h}" rx="26" fill="${INK}"/>
 <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="26" fill="#fff" stroke="${INK}" stroke-width="6"/>
 <path d="M${tailX-18} ${y+h-3} L${tailX} ${y+h+34} L${tailX+20} ${y+h-3}" fill="#fff" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/>
 <rect x="${tailX-15}" y="${y+h-9}" width="32" height="10" fill="#fff"/>
 <text x="${x+w/2}" y="${y+h/2+fs*0.36}" font-family="${big?'Lilita':'Rubik'}" font-weight="700" font-size="${fs}" fill="${INK}" text-anchor="middle">${text}</text></g>`);
}

function boom(x,y,word,rot){
 let pts=''; for(let i=0;i<24;i++){const r=i%2?95:180,a=i*Math.PI/12; pts+=`${x+Math.cos(a)*r*1.25},${y+Math.sin(a)*r} `;}
 add(`<g transform="rotate(${rot} ${x} ${y})"><polygon points="${pts}" transform="translate(10,10)" fill="${INK}"/><polygon points="${pts}" fill="#ffc93c" stroke="${INK}" stroke-width="8" stroke-linejoin="round"/>
 <text x="${x}" y="${y+30}" font-family="Lilita" font-size="96" fill="#e5484d" stroke="${INK}" stroke-width="8" paint-order="stroke" text-anchor="middle">${word}</text></g>`);
}
function stars(cx,cy){
 add(`<ellipse cx="${cx}" cy="${cy}" rx="110" ry="30" fill="none" stroke="${STYLE==='nuit'?'#fff':INK}" stroke-width="4" stroke-dasharray="10 12"/>`);
 for(const [dx,dy] of [[-100,-6],[10,28],[95,-10]]){
  const x=cx+dx,y=cy+dy; let p=''; for(let i=0;i<10;i++){const r=i%2?11:26,a=-Math.PI/2+i*Math.PI/5;p+=`${x+Math.cos(a)*r},${y+Math.sin(a)*r} `}
  add(`<polygon points="${p}" fill="#ffc93c" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>`);
 }
}
function speed(x,y){ for(let i=0;i<4;i++) add(`<path d="M${x-40-i*8} ${y-60+i*40} l -110 ${-6+i*4}" stroke="${STYLE==='nuit'?'#fff':INK}" stroke-width="7" stroke-linecap="round"/>`); }
function ground(){ if(STYLE!=='sticker') return; }

// ---------- scènes ----------
decor();
const tgtColor=ST.target;
if(SCENE==='n1'){
 hud('TRISTE',1,'il chante dans la rue',false,0.08);
 // la cible gifle : bras tendu vers la gauche ; le rappeur projeté, penché, yeux en spirale
 stick({x:760,y:1500,h:560,color:tgtColor,pose:{la:[175,185],ra:[30,80],ll:[105,100],rl:[70,75]},look:-10,mouth:'frown'});
