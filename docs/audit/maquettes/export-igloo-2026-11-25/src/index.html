<style>

#bar{position:absolute;left:120px;right:120px;top:1560px;height:44px;border-radius:24px;border:7px solid #0a0d14;background:#0b2f73;overflow:hidden}#barin{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#8fd0ff,#fff)}

.st{display:flex;align-items:center;gap:20px;font:500 31px/1.2 "DM Sans";color:#5b6884;padding:4px 0}.st i{flex:none;width:48px;height:48px;border-radius:50%;border:6px solid #b8cde8;position:relative}.st b{font-weight:800}
.st.now{color:#0a0d14}.st.now i{border-color:#1657b3}.st.now i::after{content:"";position:absolute;left:10px;top:10px;width:16px;height:16px;border-radius:50%;background:#1657b3}
.st.done{color:#0a0d14}.st.done i{border-color:#1657b3;background:#1657b3}.st.done i::after{content:"";position:absolute;left:11px;top:4px;width:12px;height:22px;border:solid #fff;border-width:0 6px 6px 0;transform:rotate(45deg)}

</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="9" data-width="1080" data-height="1920">
 <div id="scene" data-start="0" data-duration="9" data-track-index="0">
  <div id="sky"></div><div id="snow"></div>
  <div id="title">Stalak construit<br>ton igloo</div><div id="title2">Igloo terminé !<br>Ta vidéo est prête</div>
  <svg viewBox="0 0 1080 1300">
   <g id="ig"><rect class="blk" x="314.2" y="1082.0" width="65.1" height="44" rx="10"/><rect class="blk alt" x="385.3" y="1082.0" width="65.1" height="44" rx="10"/><rect class="blk" x="456.4" y="1082.0" width="65.1" height="44" rx="10"/><rect class="blk alt" x="527.5" y="1082.0" width="65.1" height="44" rx="10"/><rect class="blk" x="598.5" y="1082.0" width="65.1" height="44" rx="10"/><rect class="blk alt" x="669.6" y="1082.0" width="65.1" height="44" rx="10"/><rect class="blk" x="740.7" y="1082.0" width="65.1" height="44" rx="10"/><rect class="blk alt" x="323.6" y="1034.0" width="73.8" height="44" rx="10"/><rect class="blk" x="403.4" y="1034.0" width="73.8" height="44" rx="10"/><rect class="blk alt" x="483.2" y="1034.0" width="73.8" height="44" rx="10"/><rect class="blk" x="563.0" y="1034.0" width="73.8" height="44" rx="10"/><rect class="blk alt" x="642.8" y="1034.0" width="73.8" height="44" rx="10"/><rect class="blk" x="722.6" y="1034.0" width="73.8" height="44" rx="10"/><rect class="blk" x="343.7" y="986.0" width="67.1" height="44" rx="10"/><rect class="blk alt" x="416.8" y="986.0" width="67.1" height="44" rx="10"/><rect class="blk" x="489.9" y="986.0" width="67.1" height="44" rx="10"/><rect class="blk alt" x="563.0" y="986.0" width="67.1" height="44" rx="10"/><rect class="blk" x="636.1" y="986.0" width="67.1" height="44" rx="10"/><rect class="blk alt" x="709.2" y="986.0" width="67.1" height="44" rx="10"/><rect class="blk alt" x="377.9" y="938.0" width="68.1" height="44" rx="10"/><rect class="blk" x="451.9" y="938.0" width="68.1" height="44" rx="10"/><rect class="blk alt" x="526.0" y="938.0" width="68.1" height="44" rx="10"/><rect class="blk" x="600.0" y="938.0" width="68.1" height="44" rx="10"/><rect class="blk alt" x="674.1" y="938.0" width="68.1" height="44" rx="10"/><rect class="blk" x="437.1" y="890.0" width="77.9" height="44" rx="10"/><rect class="blk alt" x="521.0" y="890.0" width="77.9" height="44" rx="10"/><rect class="blk" x="605.0" y="890.0" width="77.9" height="44" rx="10"/><path class="blk" d="M484 890 Q560 824 636 890 Z"/></g>
   <path class="door" id="door" d="M508 1128 L508 1072 Q560 1022 612 1072 L612 1128 Z"/>
  </svg>
  <img id="m-walk" src="assets/img/walk.png" alt=""><div id="carry"></div>
  <img id="m-hype" src="assets/img/hype.png" alt="">
  <img id="bear" src="assets/img/ours.png" alt="">
  <div id="pct">0 %</div><div id="bar"><div id="barin"></div></div>

   <div class="st now" id="t0"><i></i><span><b>Je prépare tes prises</b> en pleine qualité</span></div>
   <div class="st" id="t1"><i></i><span><b>Je fabrique les images</b> : coupes, effets</span></div>
   <div class="st" id="t2"><i></i><span><b>J'assemble l'image et ton son</b></span></div>

  </div>
  <div id="confs"></div>
 </div>
</div>
<script>
const tl = gsap.timeline({ paused: true }); let seed = 11; const R = () => (seed = (seed * 16807) % 2147483647) / 2147483647; const D = 9;
const snow = document.getElementById("snow");
for (let i = 0; i < 44; i++){ const f = document.createElement("div"); f.className = "fl"; const z = 7 + R() * 15; f.style.cssText = `left:${R() * 1080}px;top:${-200 + R() * 1700}px;width:${z}px;height:${z}px;opacity:${0.4 + R() * 0.55}`; snow.appendChild(f); tl.to(f, { y: 440 + R() * 260, x: (R() - 0.5) * 80, duration: D, ease: "none" }, 0); }
tl.fromTo("#title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: .45, ease: "power3.out" }, .1);
tl.fromTo(["#pct", "#bar", "#steps"], { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: .4, ease: "power3.out", stagger: .06 }, .3);
tl.fromTo(["#m-walk", "#carry"], { x: -320 }, { x: 0, duration: .6, ease: "power3.out" }, .3);
tl.fromTo("#bear", { opacity: 0, x: 200 }, { opacity: 1, x: 0, duration: .5, ease: "power3.out" }, .5);
tl.to("#bear", { x: -18, duration: .35, ease: "sine.inOut", yoyo: true, repeat: 13 }, 1.1);
tl.to("#bear", { y: -40, duration: .25, ease: "power2.out", yoyo: true, repeat: 3, immediateRender: false }, 6.9);
// block by block: each one flies from the mascot's arms to its place on the dome
const blocks = [...document.querySelectorAll("#ig .blk")], N = blocks.length, T0 = 1.0, T1 = 6.0;
blocks.forEach((b, i) => {
  const t = T0 + (T1 - T0) * i / N;
  tl.fromTo(b, { opacity: 0, y: -60, scale: .7, transformOrigin: "50% 50%" }, { opacity: 1, y: 0, scale: 1, duration: .32, ease: "back.out(2.4)", immediateRender: false }, t);
  if (i % 3 === 0) tl.fromTo("#carry", { y: 0 }, { y: -26, duration: .14, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, t - .05);
});
tl.set(blocks, { opacity: 0 }, 0);
tl.to("#m-walk", { y: -14, duration: .2, ease: "sine.inOut", yoyo: true, repeat: 23 }, 1.0);
const pc = { v: 0 }, pctEl = document.getElementById("pct");
tl.to(pc, { v: 100, duration: T1 - T0 + .3, ease: "none", onUpdate: () => { pctEl.textContent = Math.round(pc.v) + " %"; } }, T0);
tl.fromTo("#barin", { width: "0%" }, { width: "100%", duration: T1 - T0 + .3, ease: "none" }, T0);
[0, 1, 2, 3].forEach(i => tl.call(() => { for (let k = 0; k < 4; k++) document.getElementById("t" + k).className = "st" + (k < i ? " done" : k === i ? " now" : ""); }, null, T0 + (T1 - T0) * i / 4));
tl.call(() => { for (let k = 0; k < 4; k++) document.getElementById("t" + k).className = "st done"; }, null, T1 + .3);
// finished: the door, the glow inside, the mascot cheers, confetti
tl.to("#door", { opacity: 1, duration: .3 }, T1 + .3);
tl.to("#door", { fill: "#ffd23f", duration: .5, ease: "power2.out" }, T1 + .5);
tl.to("#carry", { opacity: 0, duration: .15 }, T1 + .3);
tl.to("#title", { opacity: 0, y: -30, duration: .25, ease: "power2.in" }, T1 + .3);
tl.fromTo("#title2", { opacity: 0, y: 30, scale: .9 }, { opacity: 1, y: 0, scale: 1, duration: .45, ease: "back.out(2)" }, T1 + .5);
tl.to("#m-walk", { opacity: 0, duration: .15 }, T1 + .4);
tl.fromTo("#m-hype", { opacity: 0, y: 120, scale: .8 }, { opacity: 1, y: 0, scale: 1, duration: .4, ease: "back.out(2)" }, T1 + .45);
tl.to("#m-hype", { y: -60, duration: .3, ease: "power2.out", yoyo: true, repeat: 3, immediateRender: false }, T1 + .9);
const confs = document.getElementById("confs"), cols = ["#ffd23f", "#ff6b9a", "#5fe0a0", "#fff", "#8fd0ff"];
for (let i = 0; i < 36; i++){ const c = document.createElement("div"); c.className = "conf"; c.style.background = cols[i % 5]; c.style.left = (440 + R() * 220) + "px"; c.style.top = "640px"; confs.appendChild(c);
  tl.fromTo(c, { opacity: 1, x: 0, y: 0, rotation: 0 }, { x: (R() - .5) * 900, y: 200 + R() * 700, rotation: R() * 720, opacity: 0, duration: 1.8, ease: "power2.out", immediateRender: false }, T1 + .55 + R() * .15); }
tl.to({}, { duration: .01 }, D - .01);
window.__timelines["main"] = tl; tl.seek(0);
</script></body></html>
